# Slack app manifest for the idea-harness integration (docs/integrations.md).
#
# Create the app at https://api.slack.com/apps -> "Create New App" -> "From a
# manifest", paste this, install it, then:
#   - copy the Bot User OAuth Token (xoxb-...) into SLACK_BOT_TOKEN
#   - Basic Information -> App-Level Tokens -> generate one with the
#     connections:write scope (xapp-...) into SLACK_APP_TOKEN
#   - /invite the bot into the channel named by integrations.slack.channel
#
# Socket Mode is on, so Slack needs no Request URL: the daemon stays bound to
# loopback and opens an outbound websocket instead. The app subscribes to no
# events; it only reacts to its own buttons, its answer dialog and /idea.
display_information:
  name: idea-harness
  description: Notifications and approvals from your local idea-harness daemon.
  background_color: "#1f2937"
features:
  bot_user:
    display_name: idea-harness
    always_online: false
  slash_commands:
    - command: /idea
      description: Start an initiative or list this project's initiatives
      usage_hint: new <your idea> | status
      should_escape: false
oauth_config:
  scopes:
    bot:
      # Post notifications and thread replies.
      - chat:write
      # The /idea slash command.
      - commands
settings:
  interactivity:
    is_enabled: true
  org_deploy_enabled: false
  socket_mode_enabled: true
  token_rotation_enabled: false
