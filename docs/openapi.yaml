  /api/v1/projects/{projectId}/initiatives/{id}/risk:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - $ref: "#/components/parameters/InitiativeId"
    get:
      tags: [change-sets]
      operationId: getRiskProfile
      summary: Deterministic risk profile
      description: |
        **Moved in this release.** Was `GET /api/v1/projects/{projectId}/risk?initiative_id=`.

        Computed from the rendered patches of the initiative's change sets - no model call, no
        numeric score, just a tier and the signals that set its floor.

        This GET writes nothing. It used to persist each computed profile, which grew the database
        on every read; the profile is a pure function of the patches, so it is recomputed here
        instead.
      responses:
        default: { $ref: "#/components/responses/RoutingError" }
        "200":
          description: The risk profile computed for this initiative.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RiskProfile" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/ConfigInvalid" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }

