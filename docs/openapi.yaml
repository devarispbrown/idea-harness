      operationId: triage
      summary: What needs your judgment first (review B4)
      description: |
        Ranks every open decision, open question, and open blocking finding by impact --
        blocking, then severity, then dependents count (how many requirements cite an open
        decision) -- and labels the top 3 `priority`; the rest `optional`.
