        "200":
          description: Answered.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, const: resolved }
                required: [status]
        "400":
          description: |
            `answer is required`, or the question exists and is not open. A question id matching
            nothing answers `404`; until the next release the two were byte-identical, so a client could not
            tell an already-answered question from one that does not exist.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/ConfigInvalid" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/v1/projects/{projectId}/artifacts/{id}/body:
    parameters:
