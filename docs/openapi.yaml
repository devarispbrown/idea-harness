        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/v1/projects/{projectId}/initiatives/{id}/decisions/accept-recommendations:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - $ref: "#/components/parameters/InitiativeId"
    post:
      tags: [decisions]
      operationId: acceptRecommendations
      summary: Resolve every open decision with its recommendation (review B4)
      description: |
        Answers the ICP round's "53 things need your judgment" in one call: every OPEN decision
        on the initiative is resolved with its own `recommendation`, actor `human`. A decision the
        model raised with no recommendation is left open and named in `skipped` rather than
        resolved with an empty string.
      responses:
        default: { $ref: "#/components/responses/RoutingError" }
        "200":
          description: What was resolved and what was skipped.
          content:
            application/json:
              schema:
                type: object
                properties:
                  resolved:
                    type: array
                    items: { type: string }
                    description: Codes of the decisions resolved.
                  skipped:
                    type: array
                    items: { type: string }
                    description: Codes of open decisions left open because they had no recommendation.
                required: [resolved, skipped]
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/ConfigInvalid" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }

