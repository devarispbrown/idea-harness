    post:
      tags: [decisions]
      operationId: answerQuestion
      summary: Record a human answer
      description: The answer text is stored content-addressed; the row keeps only its digest.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                answer: { type: string }
              required: [answer]
      responses:
