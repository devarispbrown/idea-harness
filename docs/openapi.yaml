      - $ref: "#/components/parameters/InitiativeId"
    get:
      tags: [decisions]
      operationId: listDecisions
      summary: Decisions with status and recommendation
      description: |
        **Moved in this release.** Was `GET /api/v1/projects/{projectId}/decisions?initiative_id=`.
        The mutations stay flat under the project, addressed by decision id.

        Decisions asking the same question (compared after stripping leading `[...]` tags, case and
        trailing punctuation) are returned once: the newest open one, or the newest decided one if
        none is open. `?all=true` returns every row. Resolving a decision also resolves every other
