# The OpenAPI description of the idea-harness daemon API.
#
#   * `docs/embed.go` embeds this file, so a compiled binary serves itself at
#     /openapi.yaml and /openapi.json and is self-describing offline.
#   * `make api-check` compares every `method + path` registered in
#     internal/daemon/routes.go against the `paths:` below and fails on drift in
#     either direction. It does not check schemas.
#
# Hand-written. Response schemas are derived from the named Go types the
# handlers return (domain.*, projection.*, providersView, buildinfo.Info); if
# they start drifting, generating them from those types is the upgrade path.

openapi: 3.1.0

info:
  title: idea-harness daemon API
  version: 0.5.1
  summary: The local HTTP API of the idea-harness daemon.
  description: |
    The daemon's REST + SSE API is the only way into the product graph. The `idea` CLI is a thin
    HTTP client over it and the embedded web UI calls the same routes from the browser, so every
    command and every UI panel is one or more of the operations below.

    **This is a local daemon, not a hosted service.**

    - **Loopback-bound.** `Run` refuses to start on a non-loopback listener. The API token is
      served to the web UI unauthenticated inside `index.html`, so a LAN-reachable daemon would
      hand the token to anyone who loaded the page. The address is overridable through
      `IDEA_HARNESS_ADDR`, still loopback-only; the default is `127.0.0.1:8787`.
    - **Token-authenticated.** One per-install token guards everything under `/api/`. See the
      security schemes for the header, the `Bearer` alternative, the `/api/v1/health` exemption and
      the SSE query-parameter exception.
    - **Host and Origin guarded.** Before authentication, a request whose `Host` is not exactly
      `127.0.0.1`, `localhost` or `::1` is rejected `403 {"error": "invalid host"}`, and one
      carrying an `Origin` that is not a loopback origin (or is the literal `null`) is rejected
      `403 {"error": "invalid origin"}`. A missing `Origin` is allowed, which is how the CLI and
      `curl` reach the API. No CORS header is ever sent, so a page on another origin could not read
      a response even if it could make the request.
    - **No content negotiation and no versioning beyond the `/api/v1` prefix.** Responses are JSON
      except `GET /artifacts/{id}/raw` (`text/markdown`), `GET /docs/{docId}` (an attachment) and
      `GET /events` (`text/event-stream`).
    - **The documentation endpoints are not part of this surface.** `/openapi.yaml`,
      `/openapi.json` and `/api-reference` are served outside `/api/`, so they need no token and
      are deliberately not listed below.

    ## Asynchronous work

    Anything that runs the model pipeline returns `202 Accepted` with an operation id and returns
    immediately, e.g. `{"operation_id": "op_01H..."}`. Poll `GET /api/v1/operations/{id}` until its
    `status` leaves `pending`/`running`, or follow `GET /api/v1/projects/{projectId}/events` (SSE),
    which is what `idea watch` and the UI do. `POST /initiatives` returns `initiative_id` alongside
    `operation_id`; `POST /initiatives/{id}/execute` returns `executor_kind` alongside it.

    ## What changed in this release

    Breaking, and recorded in `CHANGELOG.md`:

    - **Ten initiative-scoped reads moved from a flat project path with `?initiative_id=` to the
      nested path** `/api/v1/projects/{projectId}/initiatives/{id}/{resource}`, for
      `requirements`, `assertions`, `artifacts`, `decisions`, `questions`, `findings`,
      `change-sets`, `suggested-answers`, `risk` and `doctor`. Each of those operations names the
      path it replaces. The old form also had a silent fallback — omitting `initiative_id` answered
      about the project's most recent initiative — which goes with it: the initiative is now always
      explicit.
    - **`GET /initiatives/{id}/next-move` is now `GET /initiatives/{id}/guidance`.** The wire shape
      (`action`, `why`, `affected`) is unchanged. `GET /initiatives/{id}/next` keeps its name and
      its meaning: it returns a machine-executable command token from a closed set and is
      change-set aware, while `/guidance` returns display copy and never loads change sets. The two
      can legitimately disagree; neither is a richer rendering of the other.

    Everything else keeps the method and path it had. In particular the id-addressed subresources
    stay flat under the project — `change-sets/{id}/...`, `artifacts/{id}/...`,
    `decisions/{id}/...`, `questions/{id}/answer`, `findings/{id}/...` — as do the project-scoped
    `providers`, `models`, `executors`, `seen`, `activity` and `events`.

    ## Reading this document

    - Paths carry the full `/api/v1` prefix and the server URL is the bare origin, so a path here
      is character-for-character the pattern registered in `internal/daemon/routes.go`. That is
      what `make api-check` compares.
    - Every initiative-scoped route names its path parameter `{id}`. The ten reads that moved to
      the nested path used `{initiativeId}` in 0.1.0; they were unified so a route cannot be
      registered under one name and read under the other.
  contact:
    name: idea-harness
    url: https://github.com/devarispbrown/idea-harness

servers:
  - url: http://127.0.0.1:8787
    description: The daemon's default loopback address; the port is set by IDEA_HARNESS_ADDR.

security:
  - ideaToken: []
  - bearerToken: []

tags:
  - name: daemon
    description: Liveness, build stamp and the daemon log.
  - name: projects
    description: The project registry. A project is a workspace root path.
  - name: initiatives
    description: Initiative lifecycle — create, approve, advance, execute, verify.
  - name: understanding
    description: Projections and traceability reads over one initiative.
  - name: tasks
    description: Execution-plan tasks and their editing window.
  - name: docs
    description: Context documents ingested for an initiative.
  - name: decisions
    description: Decisions and open questions.
  - name: graph
    description: Requirements, assertions, artifacts and findings.
  - name: change-sets
    description: Source mutations — review, apply, revert, conflict resolution.
  - name: operations
    description: Asynchronous operations started by the 202 endpoints.
  - name: config
    description: Providers, models and executors, backed by harness.yaml.
  - name: events
    description: The event timeline and its SSE stream.

paths:
  /api/v1/health:
    get:
      tags: [daemon]
      operationId: getHealth
      summary: Liveness probe
      description: |
        The only unauthenticated route under `/api/`, so `idea doctor` and CI can probe a daemon
        they hold no token for. Every other operation requires the token.
      security: []
      responses:
        default: { $ref: "#/components/responses/RoutingError" }
        "200":
          description: The daemon is up.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    const: ok
                  version: { type: string }
                required: [status, version]

  /api/v1/version:
    get:
      tags: [daemon]
      operationId: getVersion
      summary: Build stamp
      responses:
        default: { $ref: "#/components/responses/RoutingError" }
        "200":
          description: The binary's version, VCS revision and dirty-tree flag.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BuildInfo" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/v1/logs:
    get:
      tags: [daemon]
      operationId: getLogs
      summary: Tail the daemon log
      description: |
        Global, not project-scoped. Answers 200 with an empty `lines` array and an empty `path`
        rather than an error when the log file does not exist yet.
      parameters:
        - name: n
          in: query
          required: false
          description: Trailing lines to return. A value outside 1-2000 is ignored and 100 used.
          schema:
            type: integer
            minimum: 1
            maximum: 2000
            default: 100
      responses:
        default: { $ref: "#/components/responses/RoutingError" }
        "200":
          description: The tail of `daemon.log`.
          content:
            application/json:
              schema:
                type: object
                properties:
                  path:
                    type: string
                    description: Absolute path of the log file, or empty when it does not exist.
                  lines:
                    type: array
                    items: { type: string }
                required: [path, lines]
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/v1/projects:
    post:
      tags: [projects]
      operationId: createProject
      summary: Register a project
      description: Registers a workspace `root_path`, creating its state on first use, and returns the project id.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                root_path:
                  type: string
                  description: Absolute path of the workspace root.
              required: [root_path]
      responses:
        default: { $ref: "#/components/responses/RoutingError" }
        "200":
          description: The project id. This is a 200, not a 201.
          content:
            application/json:
              schema:
                type: object
                properties:
                  project_id: { type: string }
                required: [project_id]
        "400":
          description: "`root_path is required` - the body was unparseable or `root_path` was empty."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "500": { $ref: "#/components/responses/InternalError" }
    get:
      tags: [projects]
      operationId: listProjects
      summary: List registered projects
      responses:
        default: { $ref: "#/components/responses/RoutingError" }
        "200":
          description: Every registry entry with its root path.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ProjectRecord" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/v1/projects/{projectId}:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    get:
      tags: [projects]
      operationId: getProject
      summary: One project's registry record
      responses:
        default: { $ref: "#/components/responses/RoutingError" }
        "200":
          description: The registry record.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProjectRecord" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/ConfigInvalid" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/projects/{projectId}/initiatives:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    post:
      tags: [initiatives]
      operationId: createInitiative
      summary: Create an initiative and start the first pipeline
      description: |
        Creates the initiative from `title`/`description`, optionally ingesting inline context docs
        in the same atomic request, then starts the first pipeline run.

        The body is bounded: a doc's content is capped at 2 MiB and an initiative holds at most 100
        context docs. A doc containing a credential is rejected outright rather than redacted.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                  description: Required; the one-line statement of the idea.
                description: { type: string }
                docs:
                  type: array
                  description: Inline context docs, ingested before the pipeline starts (`idea new --doc`).
                  items:
                    type: object
                    properties:
                      content: { type: string }
                      kind:
                        type: string
                        description: Free-form category, truncated to 64 runes; defaults to "other".
                      title:
                        type: string
                        description: Truncated to 200 runes; defaults to "untitled".
                    required: [content]
              required: [title]
      responses:
        default: { $ref: "#/components/responses/RoutingError" }
        "202":
          description: Accepted. The initiative exists; the pipeline runs asynchronously.
          content:
            application/json:
              schema:
                type: object
                properties:
                  initiative_id: { type: string }
                  operation_id: { type: string }
                required: [initiative_id, operation_id]
        "400":
          description: "`title is required`, `invalid body`, `content is required`, or `document contains a credential and was rejected`."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/ConfigInvalid" }
        "404": { $ref: "#/components/responses/NotFound" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "500": { $ref: "#/components/responses/InternalError" }
    get:
      tags: [initiatives]
      operationId: listInitiatives
      summary: List the project's initiatives
      description: Ordered by creation, oldest first.
      responses:
        default: { $ref: "#/components/responses/RoutingError" }
        "200":
          description: The initiatives in this project.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Initiative" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/ConfigInvalid" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/v1/projects/{projectId}/initiatives/{id}:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - $ref: "#/components/parameters/InitiativeId"
    get:
      tags: [initiatives]
      operationId: getInitiative
      summary: One initiative
      responses:
        default: { $ref: "#/components/responses/RoutingError" }
        "200":
          description: The initiative, including its status and any failure reason.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Initiative" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/ConfigInvalid" }
        "404":
          description: "`initiative not found`, or the project is unknown."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/v1/projects/{projectId}/initiatives/{id}/understanding:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - $ref: "#/components/parameters/InitiativeId"
    get:
      tags: [understanding]
      operationId: getUnderstanding
      summary: The Current Understanding projection
      description: |
        Assembled deterministically from relational state - never LLM narration. Requirements whose
        status is `removed` are omitted.
      responses:
        default: { $ref: "#/components/responses/RoutingError" }
        "200":
          description: The projection.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Understanding" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/ConfigInvalid" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/v1/projects/{projectId}/initiatives/{id}/guidance:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - $ref: "#/components/parameters/InitiativeId"
    get:
      tags: [understanding]
      operationId: getGuidance
      summary: Recommended next move, as display copy
      description: |
        **Renamed in this release.** Was `GET /api/v1/projects/{projectId}/initiatives/{id}/next-move`;
        the wire shape (`action`, `why`, `affected`) is unchanged.

        `action` is an English sentence for a human to read. It is computed from the initiative
        status and the Understanding projection - counts of open decisions and open questions - so
        it never loads change sets and can never name one. Use `/next` when you want a command to
        execute; the two legitimately disagree.
      responses:
        default: { $ref: "#/components/responses/RoutingError" }
        "200":
          description: The guidance projection.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Guidance" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/ConfigInvalid" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/v1/projects/{projectId}/initiatives/{id}/agent-output:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - $ref: "#/components/parameters/InitiativeId"
    get:
      tags: [change-sets]
      operationId: getAgentOutput
      summary: The running coding agent's latest output
      description: |
        The last 100 lines of the coding agent's output while an execute is running, and the run's
        `state`: escape
        sequences stripped, capped at 8 KB, known secrets redacted. Reading it never waits on the
        run. Refreshed at most every 1.5 s however many clients poll, so a repeated answer is the
        cache, not a stall. `running` turns false once the agent's container is gone, including
        while the run's build and test checks continue.
      responses:
        default: { $ref: "#/components/responses/RoutingError" }
        "200":
          description: The output, or `running:false` with empty output when no agent is running.
          content:
            application/json:
              schema:
                type: object
                properties:
                  state:
                    type: string
                    enum: [idle, starting, running, finished]
                    description: |
                      `idle`: no run. `starting`: a run is planning or copying the workspace and
                      the agent has not started. `running`: the agent is running. `finished`: the
                      agent is done and the run is in its build and test checks; `output` is its
                      final output.
                  running: { type: boolean, description: "`state == running`." }
                  output: { type: string }
                required: [state, running, output]
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ConfigInvalid" }

  /api/v1/projects/{projectId}/initiatives/{id}/partial-work:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - $ref: "#/components/parameters/InitiativeId"
    delete:
      tags: [change-sets]
      operationId: discardPartialWork
      summary: Discard a stopped run's kept files ("Start over")
      description: |
        When a run stops without a change set (Stop, failure, timeout, daemon shutdown), the files
        the agent had written are kept, and the next run of the same task continues from them
        (guidance reports them as `partial_work`). This discards them, so the next run starts from
        the workspace. Succeeds when nothing is kept.
      responses:
        default: { $ref: "#/components/responses/RoutingError" }
        "200":
          description: Discarded.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, const: discarded }
                required: [status]
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ConfigInvalid" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/v1/projects/{projectId}/initiatives/{id}/next:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - $ref: "#/components/parameters/InitiativeId"
    get:
      tags: [understanding]
      operationId: getNextAction
      summary: The next command to run, as a token
      description: |
        `action` is a machine-executable token from a closed set - `advance`, `execute`,
        `review <CHG-n>`, `apply <CHG-n>`, `verify`, `resolve <reason>`, `done`, `failed`, `wait` -
        which `idea next` dispatches as the next CLI command. It walks the initiative's change
        sets, so it can name the specific one to act on.

        `resolve` carries the reason the initiative is parked, because the four are not
        interchangeable: `resolve prd` (the PRD review did not converge - approve or revise),
        `resolve plan-dependencies` (the plan has unsatisfied task dependencies - **only**
        regenerate; approving locks in an incomplete graph and leaves a blocking finding that
        wedges completion), `resolve plan` (the plan review raised blocking findings - approve or
        regenerate) and `resolve verification` (a requirement was failed after completion -
        re-verify). A bare `resolve`, with no reason, is what an initiative parked before the reason was
        recorded reports - every initiative parked in 0.3.0 or earlier included; clients should
        render it as "see `idea status`" rather than guessing.

        `failed` and `wait` are the two answers that are not steps. `wait` means an operation is
        in flight. `failed` means the initiative failed, and it carries `failure_reason`. The two
        were a single `wait` token in 0.1.0 through 0.3.0, which told a failed initiative the
        workflow was still running.

        `failure_reason` can be absent or empty even on `failed`: only an explicit failure records
        one, so an initiative moved to `failed` by a status transition alone has none. Clients must
        render the no-reason case rather than printing an empty string.
      responses:
        default: { $ref: "#/components/responses/RoutingError" }
        "200":
          description: The next action token.
          content:
            application/json:
              schema:
                type: object
                properties:
                  action: { type: string }
                  failure_reason:
                    type: string
                    description: Present only when `action` is `failed`, and may be empty even then.
                required: [action]
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/ConfigInvalid" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/v1/projects/{projectId}/initiatives/{id}/changed:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - $ref: "#/components/parameters/InitiativeId"
    get:
      tags: [understanding]
      operationId: getChanged
      summary: What Changed since the UI read cursor
      description: |
        Grouped, narrated changes since the project's `ui` read cursor, capped at 200 events, with
        machinery events (runs, operations, context bundles) hidden. Echo `through` back to
        `POST /projects/{projectId}/seen` to clear exactly what was rendered.

        The cursor is project-scoped even though this read is addressed by initiative.
      responses:
        default: { $ref: "#/components/responses/RoutingError" }
        "200":
          description: The grouped changes and the sequence they run through.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Changed" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/ConfigInvalid" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/v1/projects/{projectId}/initiatives/{id}/timeline:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - $ref: "#/components/parameters/InitiativeId"
    get:
      tags: [understanding]
      operationId: getTimeline
      summary: Human-language "what changed" timeline
      description: |
        C1, wave 3 contract. Built from the event log and the change-set, decision and stale-mark
        tables, scoped to this initiative throughout — the bug this replaces let `GET .../changed`
        leak another initiative's counts, since the events table carries no `initiative_id` of its
        own. Newest first. `idea changed` uses this endpoint.
      parameters:
        - name: since
          in: query
          required: false
          description: RFC3339 timestamp; excludes entries at or before it.
          schema: { type: string, format: date-time }
      responses:
        default: { $ref: "#/components/responses/RoutingError" }
        "200":
          description: The timeline, newest first.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/TimelineEntry" }
        "400":
          description: "`since must be RFC3339`."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/ConfigInvalid" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/v1/projects/{projectId}/initiatives/{id}/costs:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - $ref: "#/components/parameters/InitiativeId"
    get:
      tags: [understanding]
      operationId: getCosts
      summary: Spend and time per phase
      description: |
        C3, wave 3 contract. Model-call spend/time per workflow phase, from the run records that
        already exist, plus the coding-agent run count/duration separately — agent spend is
        parsed best-effort from the agent's own output and is `null` with a note when it could
        not be recovered for every run.
      responses:
        default: { $ref: "#/components/responses/RoutingError" }
        "200":
          description: The cost/time summary.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InitiativeCosts" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/ConfigInvalid" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/v1/projects/{projectId}/seen:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    post:
      tags: [understanding]
      operationId: markSeen
      summary: Advance the UI read cursor
      description: |
        Sets a read cursor to `through`, clamped to the highest event sequence, so What Changed
        never clears events that arrived mid-read.

        `initiative_id` (M1, wave 3 review fix) scopes the cursor to that one initiative
        (`ui:<initiativeId>`) -- required so that marking one initiative seen cannot advance a
        single project-wide cursor past another initiative's own, still-unseen events. Optional
        and backward compatible: omitting it keeps writing the project-wide `ui` cursor, exactly
        as every caller before this field existed.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                through:
                  type: integer
                  format: int64
                  minimum: 0
                  description: The sequence echoed from `/changed`.
                initiative_id:
                  type: string
                  description: >-
                    Scopes the cursor to this initiative (`ui:<initiativeId>`). Omitted: writes
                    the project-wide `ui` cursor (back-compat default).
              required: [through]
      responses:
        default: { $ref: "#/components/responses/RoutingError" }
        "200":
          description: The cursor that was stored.
          content:
            application/json:
              schema:
                type: object
                properties:
                  seen_seq: { type: integer, format: int64 }
                required: [seen_seq]
        "400":
          description: "`through must be a non-negative integer`."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/ConfigInvalid" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/v1/projects/{projectId}/initiatives/{id}/resume:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - $ref: "#/components/parameters/InitiativeId"
    post:
      tags: [initiatives]
      operationId: resumeInitiative
      summary: Resume a paused or interrupted initiative
      description: Synchronous. Returns the status the initiative resumed into.
      responses:
        default: { $ref: "#/components/responses/RoutingError" }
        "200":
          description: The new status.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { $ref: "#/components/schemas/InitiativeStatus" }
                required: [status]
        "409": { $ref: "#/components/responses/Conflict" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/ConfigInvalid" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/v1/projects/{projectId}/initiatives/{id}/approve:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - $ref: "#/components/parameters/InitiativeId"
    post:
      tags: [initiatives]
      operationId: approveInitiative
      summary: Human approval of the reviewed PRD
      description: |
        Synchronous. Accepts the reviewed PRD as it stands and moves the initiative to `approved`.

        Legal only from `needs_human_judgment` (and from `approved`, where it is a no-op); every
        other status answers **409**. This is a compare-and-swap: it used to be an unconditional
        write with no check at all, which released the claim a running `advance` held and let two
        advances run concurrently on one initiative.
      responses:
        default: { $ref: "#/components/responses/RoutingError" }
        "200":
          description: Approved.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { $ref: "#/components/schemas/InitiativeStatus" }
                required: [status]
        "409": { $ref: "#/components/responses/Conflict" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/ConfigInvalid" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500":
          description: |
            A domain error keeps its own message here (an initiative in a status that cannot be
            approved); a storage failure is masked to `internal error (correlation id: ...)`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/v1/projects/{projectId}/initiatives/{id}/revise:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - $ref: "#/components/parameters/InitiativeId"
    post:
      tags: [initiatives]
      operationId: reviseInitiative
      summary: Apply resolved decisions and answers, then regenerate the PRD
      responses:
        default: { $ref: "#/components/responses/RoutingError" }
        "202": { $ref: "#/components/responses/OperationAccepted" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/ConfigInvalid" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/v1/projects/{projectId}/initiatives/{id}/advance:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - $ref: "#/components/parameters/InitiativeId"
    post:
      tags: [initiatives]
      operationId: advanceInitiative
      summary: Run the Design to Execution Plan pipeline
      responses:
        default: { $ref: "#/components/responses/RoutingError" }
        "202": { $ref: "#/components/responses/OperationAccepted" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/ConfigInvalid" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/v1/projects/{projectId}/initiatives/{id}/approve-plan:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - $ref: "#/components/parameters/InitiativeId"
    post:
      tags: [initiatives]
      operationId: approvePlan
      summary: Human approval gate on the execution plan
      description: |
        Accepts the execution plan as it stands: the open findings are dispositioned `accepted_risk`
        against the human, and the initiative moves to `plan_approved`. It does **not** re-run the
        plan review — it used to, which made it a retry rather than an accept and left a
        non-converging review with no route to `plan_approved`.

        409 when the initiative is running, when it is parked on a judgment reason other than
        `plan_review`, when it already has change sets, when the plan is already approved, or when
        the plan carries an open `critical` finding from the deterministic checks — a task
        dependency cycle, which no human can sign off because it can never be scheduled.
        `revise-plan` is the route out of that last one.
      responses:
        default: { $ref: "#/components/responses/RoutingError" }
        "202": { $ref: "#/components/responses/OperationAccepted" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/ConfigInvalid" }
        "500": { $ref: "#/components/responses/InternalError" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/v1/projects/{projectId}/initiatives/{id}/revise-plan:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - $ref: "#/components/parameters/InitiativeId"
    post:
      tags: [initiatives]
      operationId: revisePlan
      summary: Regenerate the execution plan and its review
      description: Keeps the PRD and the design. An initiative state that cannot be revised answers 409.
      responses:
        default: { $ref: "#/components/responses/RoutingError" }
        "202": { $ref: "#/components/responses/OperationAccepted" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/ConfigInvalid" }
        "500": { $ref: "#/components/responses/InternalError" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/v1/projects/{projectId}/initiatives/{id}/execute:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - $ref: "#/components/parameters/InitiativeId"
    post:
      tags: [initiatives]
      operationId: executeInitiative
      summary: Run the next ready task through the executor
      description: |
        Produces a change set. The response names the executor the run will use.

        If a stopped run of the same task left files (`partial_work` on guidance), this run
        continues from them. Send `{"fresh": true}` to discard them and start from the workspace
        instead ("Start over"); they are discarded only once the run is accepted. The body is
        optional and decoded leniently.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                fresh:
                  type: boolean
                  description: Discard a stopped run's kept files, once this run is accepted.
                note:
                  type: string
                  description: |
                    D-a, wave 3 contract: an optional human note steering this one run, appended
                    to the implementer's brief and recorded on the agent run. Decoded as leniently
                    as `fresh`.
      responses:
        default: { $ref: "#/components/responses/RoutingError" }
        "202":
          description: Accepted.
          content:
            application/json:
              schema:
                type: object
                properties:
                  operation_id: { type: string }
                  executor_kind: { $ref: "#/components/schemas/ExecutorKind" }
                required: [operation_id, executor_kind]
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/ConfigInvalid" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/v1/projects/{projectId}/initiatives/{id}/pr:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - $ref: "#/components/parameters/InitiativeId"
    post:
      tags: [initiatives]
      operationId: createInitiativePR
      summary: Open a pull request for the initiative's dedicated branch
      description: |
        Review C4 piece 3. Pushes `initiative.git_branch` (created by `git.branch_per_initiative`
        on a first apply) and runs `gh pr create` with a body built from the initiative (PRD
        summary, change sets, verification progress). Synchronous: unlike apply/execute/revert this
        touches only git/GitHub state, not the workspace tree, so there is no background operation.
        Idempotent -- a repeat call answers the same `pr_url` already recorded on the initiative
        rather than opening a second PR.
      responses:
        default: { $ref: "#/components/responses/RoutingError" }
        "200":
          description: The pull request's URL (freshly opened, or the existing one on a repeat call).
          content:
            application/json:
              schema:
                type: object
                properties:
                  pr_url: { type: string }
                required: [pr_url]
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/ConfigInvalid" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: |
            The initiative has no dedicated branch yet (`git.branch_per_initiative` has not created
            one), or the GitHub CLI (`gh`) is not installed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/v1/projects/{projectId}/initiatives/{id}/verify:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - $ref: "#/components/parameters/InitiativeId"
    post:
      tags: [initiatives]
      operationId: verifyInitiative
      summary: Run the verification gate
      description: |
        Synchronous. When `requirement` is set together with a disposition, human evidence is
        recorded first; the gate then runs and the response carries the initiative status plus
        per-requirement coverage. A JSON body is required, but every field in it is optional -
        `{}` just runs the gate.

        `requirement` with no disposition is validated: a code that does not resolve answers 404
        naming it, instead of being silently discarded and answering about the initiative as a
        whole. The gate itself, and the `coverage` returned, remain initiative-wide either way.

        409 when the initiative has failed - `retry` re-runs it. The gate is deliberately still
        allowed while an operation is running, because `apply` does not wait and the documented
        apply-then-verify sequence runs inside that window.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                requirement:
                  type: string
                  description: Requirement code or id to record human evidence against.
                pass:
                  type: boolean
                  description: Only `true` records evidence; `false` records nothing.
                fail:
                  type: boolean
                  description: |
                    Records the requirement as failing verification. Send one disposition: the
                    handler takes the first of `fail`, `waived`, `pass` rather than rejecting a
                    request that sets several, so "mutually exclusive" is the CLI's rule, enforced
                    by `idea verify`, not this endpoint's.
                waived:
                  type: boolean
                  description: Records the requirement as waived. Same one-disposition rule as `fail`.
                note: { type: string }
                confirm_passing_tests:
                  type: boolean
                  description: |
                    C2/C3/H2/H4, wave 3 contract: confirms every requirement that is `approved`
                    (never `draft`, `removed`, or one already carrying a human's own
                    `verified`/`failed`/`waived` judgment), has acceptance criteria, and whose
                    mapped tests (`evidence_tests` on `GET .../requirements`) all passed, through
                    the same human-evidence path as a manual pass, actor `human`. Requires at
                    least one applied change set for the initiative. Nothing is ever
                    auto-verified without this explicit request, and one ineligible requirement
                    never aborts the rest -- every candidate is attempted independently and the
                    response says which were confirmed and which were skipped, and why.
      responses:
        default: { $ref: "#/components/responses/RoutingError" }
        "200":
          description: The status after the gate, plus coverage per requirement.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { $ref: "#/components/schemas/InitiativeStatus" }
                  coverage:
                    type: array
                    items: { $ref: "#/components/schemas/Coverage" }
                  confirmed:
                    type: array
                    items: { type: string }
                    description: >-
                      Present only when `confirm_passing_tests` was sent: the requirement codes
                      it actually confirmed.
                  skipped:
                    type: array
                    description: >-
                      Present only when `confirm_passing_tests` was sent: every candidate
                      requirement it looked at but did not confirm, and why (e.g. "no acceptance
                      criteria", "not every mapped test passed", "the initiative has no applied
                      change set yet"). A requirement that was never a candidate at all (already
                      verified/failed/waived, draft, or removed) is not listed here.
                    items:
                      type: object
                      properties:
                        requirement: { type: string }
                        reason: { type: string }
                      required: [requirement, reason]
                required: [status, coverage]
        "400":
          description: "`invalid body`, or the domain error from recording evidence or running the gate."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/ConfigInvalid" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/v1/projects/{projectId}/initiatives/{id}/suggest-answers:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - $ref: "#/components/parameters/InitiativeId"
    post:
      tags: [decisions]
      operationId: suggestAnswers
      summary: Ask the model to propose answers for the open questions
      description: Read the results back from `GET /initiatives/{id}/suggested-answers`.
      responses:
        default: { $ref: "#/components/responses/RoutingError" }
        "202": { $ref: "#/components/responses/OperationAccepted" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/ConfigInvalid" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/v1/projects/{projectId}/initiatives/{id}/why:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - $ref: "#/components/parameters/InitiativeId"
      - $ref: "#/components/parameters/GraphNodeType"
      - $ref: "#/components/parameters/GraphNodeId"
    get:
      tags: [understanding]
      operationId: getWhy
      summary: Provenance chain behind one graph node
      description: |
        Follows outgoing edges (`implements`, `derived_from`, `produced_by`, `depends_on`) from the
        node towards its sources, bounded in depth. Both `type` and `id` are required.
      responses:
        default: { $ref: "#/components/responses/RoutingError" }
        "200":
          description: The provenance edges, nearest first.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/TraceItem" }
        "400": { $ref: "#/components/responses/TraceParamsRequired" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/ConfigInvalid" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/v1/projects/{projectId}/initiatives/{id}/impact:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - $ref: "#/components/parameters/InitiativeId"
      - $ref: "#/components/parameters/GraphNodeType"
      - $ref: "#/components/parameters/GraphNodeId"
    get:
      tags: [understanding]
      operationId: getImpact
      summary: Dependents and staleness for one graph node
      description: |
        A task's change sets are not graph edges (`ChangeSet.TaskID` links them instead), so when the
        walk reaches a task, its change sets are added as synthetic dependents (`edge_type:
        "change_set"`) -- otherwise impact on a requirement or decision could reach the task and stop
        there (review A4 #4/#5).
      responses:
        default: { $ref: "#/components/responses/RoutingError" }
        "200":
          description: The dependent edges, each with a staleness classification.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ImpactItem" }
        "400": { $ref: "#/components/responses/TraceParamsRequired" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/ConfigInvalid" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/v1/projects/{projectId}/initiatives/{id}/trace:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - $ref: "#/components/parameters/InitiativeId"
      - $ref: "#/components/parameters/GraphNodeType"
      - $ref: "#/components/parameters/GraphNodeId"
    get:
      tags: [understanding]
      operationId: getTrace
      summary: Provenance and impact in one response
      responses:
        default: { $ref: "#/components/responses/RoutingError" }
        "200":
          description: Both directions at once.
          content:
            application/json:
              schema:
                type: object
                properties:
                  why:
                    type: array
                    items: { $ref: "#/components/schemas/TraceItem" }
                  impact:
                    type: array
                    items: { $ref: "#/components/schemas/ImpactItem" }
                required: [why, impact]
        "400": { $ref: "#/components/responses/TraceParamsRequired" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/ConfigInvalid" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/v1/projects/{projectId}/initiatives/{id}/diff:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - $ref: "#/components/parameters/InitiativeId"
    get:
      tags: [understanding]
      operationId: getSemanticDiff
      summary: Structured requirement and decision diff
      description: |
        Reports requirements as added versus removed and decisions as open, decided or superseded,
        rather than diffing rendered markdown. Not a source diff - that is
        `GET /change-sets/{id}/diff`.
      responses:
        default: { $ref: "#/components/responses/RoutingError" }
        "200":
          description: The structured diff.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SemanticDiff" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/ConfigInvalid" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/v1/projects/{projectId}/initiatives/{id}/operations:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - $ref: "#/components/parameters/InitiativeId"
    get:
      tags: [operations]
      operationId: listInitiativeOperations
      summary: Every operation recorded for this initiative
      description: |
        The initiative's operation history, newest first (`ORDER BY created_at DESC`). `GET /operations/{id}` polls one
        operation; this lists them all, which is what a UI needs to show what has run.
      responses:
        default: { $ref: "#/components/responses/RoutingError" }
        "200":
          description: The operations.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Operation" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/ConfigInvalid" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }
  /api/v1/projects/{projectId}/artifacts/{id}/comments:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - $ref: "#/components/parameters/ArtifactVersionId"
    get:
      tags: [artifacts]
      operationId: listDocComments
      summary: Comments on one artifact version
      description: Comments are attached to a specific immutable version, not to the artifact family.
      responses:
        default: { $ref: "#/components/responses/RoutingError" }
        "200":
          description: The comments.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/DocComment" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/ConfigInvalid" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }
    post:
      tags: [artifacts]
      operationId: createDocComment
      summary: Comment on an artifact version
      description: |
        `section` is optional and names the part of the document being commented on. Both fields are
        passed through the project's redactor before they are stored, like every other text the
        daemon persists.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [text]
              properties:
                section: { type: string }
                text: { type: string }
      responses:
        default: { $ref: "#/components/responses/RoutingError" }
        "201":
          description: The stored comment.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DocComment" }
        "400":
          description: text was empty.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/ConfigInvalid" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }
  /api/v1/projects/{projectId}/comments/{id}/promote:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - name: id
        in: path
        required: true
        schema: { type: string }
        description: Comment id.
    post:
      tags: [artifacts]
      operationId: promoteDocComment
      summary: Promote a comment into an open question
      description: |
        Turns a comment on a document into a tracked open Question, so a remark made while reading
        becomes something the workflow will surface rather than something buried in a margin. The
        comment records the question it produced in `promoted_question_id`.
      responses:
        default: { $ref: "#/components/responses/RoutingError" }
        "200":
          description: The question the comment became.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Question" }
        "400":
          description: The comment cannot be promoted (already promoted, or its initiative is not accepting questions).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/ConfigInvalid" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }
  /api/v1/projects/{projectId}/initiatives/{id}/impact-counts:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - $ref: "#/components/parameters/InitiativeId"
    get:
      tags: [graph]
      operationId: impactCounts
      summary: Dependent counts for several graph nodes at once
      description: |
        The blast radius of many nodes in one request, for a UI that would otherwise call
        `/impact` per node. Batched rather than repeated, and bounded: too many nodes is a 400, not
        a slow query.
      parameters:
        - name: nodes
          in: query
          required: true
          schema: { type: string }
          description: |
            Comma-separated `type:id` pairs, e.g.
            `requirement:47093208274b1f5d9e3a6c8b2f4d1e07`. An entry that is not `type:id` is a 400.

            **The id is the opaque graph id, not the human code.** `requirement:REQ-1` is accepted
            and answers `0` — indistinguishable from a node that genuinely has no edges. Resolve the
            code first via the initiative's `/requirements`, `/tasks` or `/decisions` listing, which
            is what the CLI and the web UI both do. Unlike `ChangeSetId`, a human code does not
            resolve here.
      responses:
        default: { $ref: "#/components/responses/RoutingError" }
        "200":
          description: Dependent count per node.
          content:
            application/json:
              schema:
                type: object
                properties:
                  counts:
                    type: object
                    additionalProperties: { type: integer }
        "400":
          description: nodes was missing, malformed, or listed too many entries.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/ConfigInvalid" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }
  /api/v1/projects/{projectId}/initiatives/{id}/stale/{staleId}/ack:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - $ref: "#/components/parameters/InitiativeId"
      - $ref: "#/components/parameters/StaleId"
    post:
      tags: [graph]
      operationId: ackStaleItem
      summary: Acknowledge a stale item, clearing it
      description: |
        Review A4 #5: a decision reopened (or re-resolved differently) after tasks/change sets were
        built on it marks the requirements that cite it, their tasks, and their applied change sets
        stale (`GET /guidance`'s `stale_items`, and `staleness: "stale"` on `/impact`). Clears one
        item by acknowledging it; re-planning (`revise-plan`/`reopen-phase`) clears every stale item
        for the initiative at once instead.
      responses:
        default: { $ref: "#/components/responses/RoutingError" }
        "200":
          description: Cleared.
          content:
            application/json:
              schema:
                type: object
                properties:
                  cleared: { type: boolean }
                required: [cleared]
        "400":
          description: The stale item does not exist, belongs to another initiative, or is already cleared.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/ConfigInvalid" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }
  /api/v1/projects/{projectId}/initiatives/{id}/requirements/{reqId}/verification-task:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - $ref: "#/components/parameters/InitiativeId"
      - name: reqId
        in: path
        required: true
        schema: { type: string }
        description: Requirement id or code (`REQ-1`).
    post:
      tags: [tasks]
      operationId: generateVerificationTask
      summary: Add a plan task that verifies this requirement
      description: |
        Creates a task whose job is to verify the named requirement, so the plan carries the work of
        proving a requirement rather than leaving verification to be remembered.
      responses:
        default: { $ref: "#/components/responses/RoutingError" }
        "200":
          description: The created task.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Task" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/ConfigInvalid" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }
  /api/v1/projects/{projectId}/initiatives/{id}/retry:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - $ref: "#/components/parameters/InitiativeId"
    post:
      tags: [initiatives]
      operationId: retryInitiative
      summary: Re-run a failed initiative under a chosen model
      description: |
        Restarts a run that failed. `model` names the model explicitly rather than inheriting one
        - a run that failed on one model is often retried on another, and making the choice part
        of the request keeps that decision in the operation's record.

        M4, wave 3 review fix: the whole body, including `model`, is optional and decoded
        leniently (like `fresh`/`note` on `/execute`) - a caller that sends only `{"note":"..."}`
        must not be rejected as if `model` were required. An absent or blank `model` falls back
        to the initiative's already-configured default model, same as before this field existed.

        Asynchronous: poll the returned operation.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                model:
                  type: string
                  description: >-
                    `provider/model`, e.g. `anthropic/claude-sonnet-5`. Optional: falls back to
                    the initiative's configured default model when absent or blank.
                note:
                  type: string
                  description: |
                    D-a, wave 3 contract: an optional human note steering this retry. Retry re-runs
                    framing→research→PRD→review rather than the implementer, so it joins the
                    framing prompt (there is no implementer brief at this stage) and is recorded on
                    that run. Decoded leniently.
      responses:
        default: { $ref: "#/components/responses/RoutingError" }
        "202": { $ref: "#/components/responses/OperationAccepted" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/ConfigInvalid" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: The initiative is not in a state that can be retried.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "500": { $ref: "#/components/responses/InternalError" }
  /api/v1/projects/{projectId}/initiatives/{id}/reopen-phase:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - $ref: "#/components/parameters/InitiativeId"
    post:
      tags: [initiatives]
      operationId: reopenPhase
      summary: Re-run one design stage and everything downstream of it
      description: |
        Reopens a completed design stage and cascades: the stage runs again and the work derived
        from it is re-derived, rather than leaving a plan built on an assumption that has since
        changed.

        Asynchronous: poll the returned operation.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phase]
              properties:
                phase:
                  type: string
                  enum: [architecture, product_design, verification_design]
      responses:
        default: { $ref: "#/components/responses/RoutingError" }
        "202": { $ref: "#/components/responses/OperationAccepted" }
        "400":
          description: The body was malformed, or phase was not one of the three design stages.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/ConfigInvalid" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: The initiative is not in a state where that phase can be reopened.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "500": { $ref: "#/components/responses/InternalError" }
  /api/v1/projects/{projectId}/attention:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    get:
      tags: [projects]
      operationId: listAttention
      summary: Cross-initiative rollup for the attention inbox
      description: |
        One request covering every initiative in the project: the inputs a client needs to derive
        each initiative's phase, plus counts of what is waiting on a human. It exists so a home
        screen does not issue one request per initiative per entity.
      responses:
        default: { $ref: "#/components/responses/RoutingError" }
        "200":
          description: The rollups.
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/InitiativeRollup" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/ConfigInvalid" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/v1/projects/{projectId}/queue:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    get:
      tags: [projects]
      operationId: listQueue
      summary: Cross-initiative "needs you" queue
      description: |
        D-b, wave 3 contract. Everything that needs the user across every initiative in the
        project: open blocking decisions, change sets awaiting review, conflicts, denials, stale
        items, and verifications ready to confirm. Ranked blocking first, then by age; the list
        is returned pre-sorted.

        `rank` (H6, wave 3 review fix) is a small 1..N ordinal position in that sorted list -- 1
        is always the single most urgent item, N is the list's length -- never the daemon's
        internal tier/age sort key (which routinely exceeds a double's safe-integer range and has
        no meaning on its own). A denied change set (H3, review fix) appears here only for the
        latest change set of its task, and only when a finding on it actually carries a
        machine-readable deny code -- never for a plain human reject, a plain check failure, or an
        attempt since superseded by a later one on the same task. A "ready to confirm" item (H4)
        mirrors `confirm_passing_tests`' own eligibility: only an `approved` requirement. An
        initiative that is `complete` or `failed` contributes nothing (H3): the queue is nothing
        left for either to act on through it.
      responses:
        default: { $ref: "#/components/responses/RoutingError" }
        "200":
          description: The queue, pre-sorted by `rank`.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/QueueItem" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/ConfigInvalid" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/v1/projects/{projectId}/artifacts/diff:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    get:
      tags: [artifacts]
      operationId: diffArtifactVersions
      summary: Unified line diff between two versions of one artifact
      description: |
        Project-scoped rather than initiative-scoped: both versions are named by id, so there is
        nothing to disambiguate. Both must belong to the SAME artifact — comparing versions of
        different artifacts is a 400, not an empty diff.

        The diff is O(lines squared), so bodies are capped at 1 MiB and 20,000 lines; exceeding
        either is a 413 rather than a hung daemon.
      parameters:
        - name: from
          in: query
          required: true
          schema: { type: string }
          description: Artifact **version** id to diff from.
        - name: to
          in: query
          required: true
          schema: { type: string }
          description: Artifact **version** id to diff to.
      responses:
        default: { $ref: "#/components/responses/RoutingError" }
        "200":
          description: The unified diff.
          content:
            application/json:
              schema:
                type: object
                properties:
                  kind: { type: string, description: "The artifact kind, e.g. `prd`." }
                  from_version: { type: integer }
                  to_version: { type: integer }
                  diff: { type: string, description: Unified diff text. }
        "400":
          description: A version id is missing, or the two versions belong to different artifacts.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/ConfigInvalid" }
        "404":
          description: Either version id does not exist.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "413":
          description: An artifact body exceeds the diff size or line cap.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "500": { $ref: "#/components/responses/InternalError" }
  /api/v1/projects/{projectId}/initiatives/{id}/tasks:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - $ref: "#/components/parameters/InitiativeId"
    get:
      tags: [tasks]
      operationId: listTasks
      summary: Execution-plan tasks, in plan order
      description: Ordered by the stored plan position, then by creation - the order `POST /tasks/reorder` sets.
      responses:
        default: { $ref: "#/components/responses/RoutingError" }
        "200":
          description: The tasks.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Task" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/ConfigInvalid" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }
    post:
      tags: [tasks]
      operationId: addTask
      summary: Add a task to the plan
      description: |
        Only while the plan is editable: the initiative must be `plan_approved` or
        `needs_human_judgment` and have no unfinished operation. A task implements one or more
        requirements, N:M (review A4 #3/#4): `implements` (single, kept for compatibility) and
        `requirement_ids` (one or more) are merged, resolved by exact id or by code (tolerant of
        case and a "REQ-3: title" form), and de-duplicated; **at least one is required**. `depends_on`
        entries may name existing tasks by title, code or id. Title and statement are redacted before
        they are stored.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                  description: Required, non-blank.
                statement: { type: string }
                priority:
                  allOf:
                    - $ref: "#/components/schemas/RequirementPriority"
                  description: An unrecognised value silently becomes `should`.
                estimate: { type: string }
                implements:
                  type: string
                  description: A single requirement code or id, kept for compatibility. Prefer requirement_ids.
                requirement_ids:
                  type: array
                  items: { type: string }
                  description: One or more requirement codes or ids. Merged with `implements`; at least one of the two is required.
                depends_on:
                  type: array
                  items: { type: string }
                  description: Existing task titles, codes or ids.
              required: [title]
      responses:
        default: { $ref: "#/components/responses/RoutingError" }
        "200":
          description: The created task. This is a 200, not a 201.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Task" }
        "400":
          description: "`title is required`, `requirement_ids is required (at least one)`, `requirement_ids references an unknown requirement \"...\"`, or `depends_on references an unknown task \"...\"`."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/ConfigInvalid" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/TaskNotEditable" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/v1/projects/{projectId}/initiatives/{id}/tasks/reorder:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - $ref: "#/components/parameters/InitiativeId"
    post:
      tags: [tasks]
      operationId: reorderTasks
      summary: Reorder the plan
      description: The full ordered list of task ids. Returns the plan as it now stands.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                task_ids:
                  type: array
                  minItems: 1
                  items: { type: string }
              required: [task_ids]
      responses:
        default: { $ref: "#/components/responses/RoutingError" }
        "200":
          description: The reordered tasks.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Task" }
        "400":
          description: "`task_ids is required`, or the store's own ordering error."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/ConfigInvalid" }
        "500": { $ref: "#/components/responses/InternalError" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/TaskNotEditable" }

  /api/v1/projects/{projectId}/initiatives/{id}/tasks/{taskId}:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - $ref: "#/components/parameters/InitiativeId"
      - $ref: "#/components/parameters/TaskId"
    patch:
      tags: [tasks]
      operationId: updateTask
      summary: Edit a task
      description: |
        Only the fields present are changed; an empty or blank string leaves the current value in
        place. Subject to the same editable window as `POST /tasks`, plus: the task must belong to
        this initiative, must not be `done` or `cancelled`, and must have no change sets yet.
        `requirement_ids`, when present, REPLACES the task's requirement links entirely (resolved
        the same tolerant way as `POST /tasks`); omit the field to leave them untouched. An empty
        array is refused -- at least one requirement is required (review A4 #3).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title: { type: string }
                statement: { type: string }
                priority: { $ref: "#/components/schemas/RequirementPriority" }
                estimate:
                  type: string
                  description: Written through as given, so an empty string clears it.
                requirement_ids:
                  type: array
                  items: { type: string }
                  description: Replaces the task's requirement links. Omit to leave unchanged; an empty array is a 400.
      responses:
        default: { $ref: "#/components/responses/RoutingError" }
        "200":
          description: The task after the edit.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Task" }
        "400":
          description: "`invalid body`, `invalid priority`, `requirement_ids is required (at least one)`, or `requirement_ids references an unknown requirement \"...\"`."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/ConfigInvalid" }
        "404":
          description: "`task not found`, or the initiative or project is unknown."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409": { $ref: "#/components/responses/TaskNotEditable" }
        "500": { $ref: "#/components/responses/InternalError" }
    delete:
      tags: [tasks]
      operationId: deleteTask
      summary: Delete a task
      description: Refused while another task still declares a `depends_on` edge to this one.
      responses:
        default: { $ref: "#/components/responses/RoutingError" }
        "200":
          description: Deleted.
          content:
            application/json:
              schema:
                type: object
                properties:
                  deleted: { type: boolean, const: true }
                required: [deleted]
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/ConfigInvalid" }
        "404":
          description: "`task not found`, or the initiative or project is unknown."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: |
            The editable-window message, or a readable refusal naming every task that still
            depends on this one (review B3), e.g.
            `TASK-1 cannot be deleted: TASK-3, TASK-4 depend on it. Remove those dependencies
            first, or delete them too.` (it used to be the undifferentiated
            `another task depends on this task; remove that dependency first`).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/v1/projects/{projectId}/initiatives/{id}/tasks/{taskId}/depends-on:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - $ref: "#/components/parameters/InitiativeId"
      - $ref: "#/components/parameters/TaskId"
    post:
      tags: [tasks]
      operationId: setTaskDependsOn
      summary: Set a task's dependencies (review B3)
      description: |
        Replaces the task's `depends_on` wholesale (unlike `PATCH .../tasks/{taskId}`, which
        leaves it untouched when omitted) -- an empty list is a legitimate request, "make this
        task depend on nothing". Entries may name existing tasks by title, code or id, the same
        tolerant resolution `POST /tasks` uses. Refused if the change would introduce a
        dependency cycle anywhere in the initiative's task graph, not just a direct one. Subject
        to the same editable window as `PATCH .../tasks/{taskId}`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                depends_on:
                  type: array
                  items: { type: string }
              required: [depends_on]
      responses:
        default: { $ref: "#/components/responses/RoutingError" }
        "200":
          description: The task after the edit.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Task" }
        "400":
          description: "`invalid body`, `depends_on references an unknown task \"...\"`, `a task cannot depend on itself`, or `that dependency would create a cycle: ...`."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/ConfigInvalid" }
        "404":
          description: "`task not found`, or the initiative or project is unknown."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409": { $ref: "#/components/responses/TaskNotEditable" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/v1/projects/{projectId}/initiatives/{id}/tasks/{taskId}/split:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - $ref: "#/components/parameters/InitiativeId"
      - $ref: "#/components/parameters/TaskId"
    post:
      tags: [tasks]
      operationId: splitTask
      summary: Split a task into two or more (review B3)
      description: |
        Each replacement task's `requirement_ids` defaults to the original task's own
        requirements when omitted. Every replacement inherits the original's outgoing
        `depends_on`, and anything that depended on the original now depends on ALL the
        replacements (a safe superset; narrow it afterward with `POST .../depends-on`). The
        original task is deleted once the replacements exist. Subject to the same editable
        window as `PATCH .../tasks/{taskId}`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                tasks:
                  type: array
                  minItems: 2
                  items:
                    type: object
                    properties:
                      title: { type: string, description: Required, non-blank. }
                      statement: { type: string }
                      requirement_ids:
                        type: array
                        items: { type: string }
                        description: Defaults to the original task's own requirements when omitted.
                    required: [title]
              required: [tasks]
      responses:
        default: { $ref: "#/components/responses/RoutingError" }
        "200":
          description: The new replacement tasks.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Task" }
        "400":
          description: "`tasks must name at least 2 replacement tasks`, `each replacement task needs a title`, or `requirement_ids references an unknown requirement \"...\"`."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/ConfigInvalid" }
        "404":
          description: "`task not found`, or the initiative or project is unknown."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409": { $ref: "#/components/responses/TaskNotEditable" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/v1/projects/{projectId}/initiatives/{id}/tasks/merge:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - $ref: "#/components/parameters/InitiativeId"
    post:
      tags: [tasks]
      operationId: mergeTasks
      summary: Merge two tasks into one (review B3)
      description: |
        `task_ids` names exactly two tasks; the first survives. The requirements each task
        implements are unioned onto the survivor, their statements are concatenated (survivor's,
        blank line, merged task's), every dependency edge either task held is rewired onto the
        survivor (including anything that depended on the merged task), and the merged task is
        deleted. Subject to the same editable window as `PATCH .../tasks/{taskId}`, checked for
        BOTH tasks.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                task_ids:
                  type: array
                  minItems: 2
                  maxItems: 2
                  items: { type: string }
                  description: "[survivor, task to merge in]."
              required: [task_ids]
      responses:
        default: { $ref: "#/components/responses/RoutingError" }
        "200":
          description: The survivor task after the merge.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Task" }
        "400":
          description: "`task_ids must name exactly 2 tasks`."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/ConfigInvalid" }
        "404":
          description: "`task not found: ...`, or the initiative or project is unknown."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
