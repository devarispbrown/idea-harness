      - $ref: "#/components/parameters/InitiativeId"
    get:
      tags: [decisions]
      operationId: listDecisions
      summary: Decisions with status and recommendation
      description: |
        **Moved in this release.** Was `GET /api/v1/projects/{projectId}/decisions?initiative_id=`.
        The mutations stay flat under the project, addressed by decision id.

        Decisions asking the same question (compared after stripping leading `[...]` tags, case and
        trailing punctuation) are returned once: the newest open one, or the newest decided one if
        none is open. `?all=true` returns every row. Resolving a decision also resolves every other
        open decision in the initiative that asks the same question.
      responses:
        default: { $ref: "#/components/responses/RoutingError" }
        "200":
          description: The decisions.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Decision" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/ConfigInvalid" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/v1/projects/{projectId}/initiatives/{id}/decisions/accept-recommendations:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - $ref: "#/components/parameters/InitiativeId"
    post:
      tags: [decisions]
      operationId: acceptRecommendations
      summary: Resolve every open decision with its recommendation (review B4)
      description: |
        Answers the ICP round's "53 things need your judgment" in one call: every OPEN decision
        on the initiative is resolved with its own `recommendation`, actor `human`. When a decision
        has `options`, the recommendation must map onto exactly one of them -- verbatim, an "Option
        B"/letter/index reference, or a case/whitespace/punctuation-tolerant match -- or it is left
        open and named in `skipped` with a `reason`, along with a decision the model raised with no
        recommendation at all.
      responses:
        default: { $ref: "#/components/responses/RoutingError" }
        "200":
          description: What was resolved and what was skipped.
          content:
            application/json:
              schema:
                type: object
                properties:
                  resolved:
                    type: array
                    items: { type: string }
                    description: Codes of the decisions resolved.
                  skipped:
                    type: array
                    items:
                      type: object
                      properties:
                        code: { type: string, description: The decision's code. }
                        reason:
                          type: string
                          description: |
                            Why it was left open: no recommendation was given, the recommendation
                            did not match any option (or matched more than one), or it was resolved
                            by a concurrent request while this call was running.
                      required: [code, reason]
                    description: Open decisions left open, and why.
                required: [resolved, skipped]
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/ConfigInvalid" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/v1/projects/{projectId}/initiatives/{id}/gaps:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - $ref: "#/components/parameters/InitiativeId"
      - $ref: "#/components/parameters/GapKindFilter"
    get:
      tags: [understanding]
      operationId: listGaps
      summary: Product Graph gaps (`idea gaps`)
      description: |
        A deterministic gap analysis over one initiative's Product Graph -- no model call: requirements
        nothing implements, acceptance criteria nothing verified, verification evidence that failed or
        predates the code it verified, unvalidated assumptions the plan rests on, decisions whose basis
        moved, orphan tasks and change sets, and artifacts older than what they were generated from.
        Each gap names its kind, which trigger fired (`state`), a severity, the nodes involved, a
        one-line why, and the command that closes it. Most severe first. The exact trigger of every
        kind and state is documented in docs/architecture.md, "Asking the graph: gaps".
      responses:
        default: { $ref: "#/components/responses/RoutingError" }
        "200":
          description: The report.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GapReport" }
        "400":
          description: "`kind` named an unknown gap kind; the message lists the known ones."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/ConfigInvalid" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/v1/projects/{projectId}/gaps:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - $ref: "#/components/parameters/GapKindFilter"
    get:
      tags: [projects]
      operationId: listProjectGaps
      summary: Product Graph gaps across every initiative
      description: |
        The same analysis as `GET .../initiatives/{id}/gaps`, run over every initiative of the
        project and merged into one report (`initiative_id` omitted at the top level; every gap
        carries its own). What `idea gaps --all` reads, so a CI gate over a project is one request.
      responses:
        default: { $ref: "#/components/responses/RoutingError" }
        "200":
          description: The report.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GapReport" }
        "400":
          description: "`kind` named an unknown gap kind; the message lists the known ones."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/ConfigInvalid" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/v1/projects/{projectId}/assertions/{id}/status:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - name: id
        in: path
        required: true
        description: Assertion id.
        schema: { type: string }
    post:
      tags: [graph]
      operationId: setAssertionStatus
      summary: Record a human judgment on an assumption or hypothesis
      description: |
        Moves an assertion out of `candidate`: `accepted` (validated), `disputed` (contested, still
        unvalidated) or `retracted` (refuted). The only path that does -- framing and research record
        every assumption as a candidate -- and what closes an `unvalidated_assumption` gap
        (`idea assumption <id> accept|dispute|retract`). A retracted assertion that live nodes still
        rest on becomes an `unvalidated_assumption` gap in state `refuted`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: string
                  enum: [accepted, disputed, retracted]
              required: [status]
      responses:
        default: { $ref: "#/components/responses/RoutingError" }
        "200":
          description: Recorded.
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string }
                  status: { type: string }
                required: [id, status]
        "400":
          description: The body is not JSON, or `status` is not one of the three judgments.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: The assertion is superseded (a retry replaced it); its replacement is the live claim.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/ConfigInvalid" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/v1/projects/{projectId}/initiatives/{id}/triage:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - $ref: "#/components/parameters/InitiativeId"
    get:
      tags: [decisions]
      operationId: triage
      summary: What needs your judgment first (review B4)
      description: |
        Ranks every open decision, open question, and open blocking finding by impact --
        blocking, then severity, then dependents count (how many requirements cite an open
        decision) -- and labels the top 3 `priority`; the rest `optional`.
      responses:
        default: { $ref: "#/components/responses/RoutingError" }
        "200":
          description: The ranked items.
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/TriageItem" }
                required: [items]
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/ConfigInvalid" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/v1/projects/{projectId}/initiatives/{id}/questions:
