    get:
      tags: [graph]
      operationId: getArtifactBody
      summary: One artifact version's body, sanitized, as JSON
      responses:
        default: { $ref: "#/components/responses/RoutingError" }
        "200":
          description: The sanitized markdown body with its kind and version.
          content:
            application/json:
              schema:
                type: object
                properties:
                  kind: { $ref: "#/components/schemas/ArtifactKind" }
                  version: { type: integer }
                  body:
                    type: string
                    description: Markdown, passed through the markdown sanitizer before serving.
                  created_at: { type: string, format: date-time }
                required: [kind, version, body, created_at]
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/ConfigInvalid" }
        "404":
          description: "`artifact not found`."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "500":
          description: "`artifact body missing` - the version row exists but its blob does not."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/v1/projects/{projectId}/artifacts/{id}/raw:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - $ref: "#/components/parameters/ArtifactVersionId"
    get:
      tags: [graph]
      operationId: getArtifactRaw
      summary: One artifact version's body as a markdown download
      description: |
        **Not JSON.** The same body as `/body` but unsanitized and served as
        `text/markdown` for download or export.
      responses:
        default: { $ref: "#/components/responses/RoutingError" }
        "200":
          description: The raw markdown.
          headers:
            Content-Disposition:
              description: "`attachment; filename=<kind>-v<version>.md`"
              schema: { type: string }
          content:
            text/markdown:
              schema: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/ConfigInvalid" }
        "404":
          description: "`artifact not found`."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "500":
          description: "`artifact body missing`."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/v1/projects/{projectId}/findings/{id}/disposition:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - name: id
        in: path
        required: true
        description: Finding id.
        schema: { type: string }
    post:
      tags: [graph]
      operationId: setFindingDisposition
      summary: Set a finding's disposition
      description: |
        `not_a_secret` is valid only when the finding's `category` is `secret_sweep` (review
        changes #1); every other category refuses it with 400. A finding whose
        `secret_overridable` is `false` (review H3 -- a value drawn from the project's own
        configured secrets) refuses it too, unconditionally, with 400. Recording it also writes a
        `SecretAllowlistEntry` for the finding's `secret_fingerprint` scoped to `secret_path`, so
        the secret sweep ignores that exact (fingerprint, path) pair from then on, at Execute,
        Apply, and the deterministic-check output sweep.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                disposition: { $ref: "#/components/schemas/Disposition" }
              required: [disposition]
      responses:
        default: { $ref: "#/components/responses/RoutingError" }
        "200":
          description: Recorded.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, const: dispositioned }
                required: [status]
        "400":
          description: "`disposition is required`, the store's rejection of an unknown disposition, or `not_a_secret` on a finding that is not `secret_sweep`."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/ConfigInvalid" }
        "500": { $ref: "#/components/responses/InternalError" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/projects/{projectId}/findings/{id}/note:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - name: id
        in: path
        required: true
        description: Finding id.
        schema: { type: string }
    post:
      tags: [graph]
      operationId: setFindingNote
      summary: Attach a human note to a finding
      description: The note is redacted before it is stored.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                note: { type: string }
              required: [note]
      responses:
        default: { $ref: "#/components/responses/RoutingError" }
        "200":
          description: Recorded.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, const: noted }
                required: [status]
        "400":
          description: "`note is required` (missing, unparseable, or blank), or the store's rejection."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/ConfigInvalid" }
        "500": { $ref: "#/components/responses/InternalError" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/projects/{projectId}/secret-allowlist:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    get:
      tags: [graph]
      operationId: listSecretAllowlist
      summary: List this project's "not a secret" overrides
      description: |
        Every fingerprint a human dispositioned `not_a_secret` on a `secret_sweep` finding (review
        changes #1): the secret sweep ignores each of these from then on, at both Execute and
        Apply. The fingerprint itself is never returned in full -- only a short prefix, enough to
        tell entries apart -- and the value it was computed from never was.
      responses:
        default: { $ref: "#/components/responses/RoutingError" }
        "200":
          description: The project's allowlist entries, newest first.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/SecretAllowlistEntry" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ConfigInvalid" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/v1/projects/{projectId}/secret-allowlist/{id}:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - name: id
        in: path
        required: true
        description: Allowlist entry id.
        schema: { type: string }
    delete:
      tags: [graph]
      operationId: revokeSecretAllowlist
      summary: Revoke a "not a secret" override
      description: Removes one allowlist entry, so the secret sweep denies that fingerprint again.
      responses:
        default: { $ref: "#/components/responses/RoutingError" }
        "200":
          description: Revoked.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, const: revoked }
                required: [status]
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ConfigInvalid" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/v1/projects/{projectId}/change-sets/{id}:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - $ref: "#/components/parameters/ChangeSetId"
    get:
      tags: [change-sets]
      operationId: getChangeSet
      summary: One change set
      responses:
        default: { $ref: "#/components/responses/RoutingError" }
        "200":
          description: The change set.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChangeSet" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/ConfigInvalid" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/projects/{projectId}/change-sets/{id}/checks:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - $ref: "#/components/parameters/ChangeSetId"
    get:
      tags: [change-sets]
      operationId: listChangeSetChecks
      summary: Deterministic checks for a change set
      description: |
        Projected from the change set's own findings, keeping only the `patch_applies`, `build` and
        `tests` categories. A finding dispositioned `not_applicable` reads as `not_applicable`; a
        `high` or `critical` severity reads as `fail`; anything else reads as `pass`.
      responses:
        default: { $ref: "#/components/responses/RoutingError" }
        "200":
          description: The checks and their tallies.
          content:
            application/json:
              schema:
                type: object
                properties:
                  checks:
                    type: array
                    items:
                      type: object
                      properties:
                        name:
                          type: string
                          enum: [patch_applies, build, tests]
                        status:
                          type: string
                          enum: [pass, fail, not_applicable]
                        summary: { type: string }
                        evidence: { type: string }
                        deny_code: { type: string }
                      required: [name, status, summary]
                  pass: { type: integer }
                  fail: { type: integer }
                  not_applicable: { type: integer }
                required: [checks, pass, fail, not_applicable]
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/ConfigInvalid" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/v1/projects/{projectId}/change-sets/{id}/diff:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - $ref: "#/components/parameters/ChangeSetId"
    get:
      tags: [change-sets]
      operationId: getChangeSetDiff
      summary: The change set's patch, rendered
      description: |
        `patch` is the whole rendered diff as one string; `files` is the same change set as a
        per-file list, for a UI that renders file by file.

        File contents are redacted **at this display surface, not at write time**: the raw blob
        store is deliberately redaction-free so apply and revert round-trip byte-for-byte. See
        `docs/security-model.md`, "What this does not protect against".
      responses:
        default: { $ref: "#/components/responses/RoutingError" }
        "200":
          description: The rendered patch, plus the per-file list.
          content:
            application/json:
              schema:
                type: object
                properties:
                  patch: { type: string }
                  files:
                    type: array
                    description: |
                      One entry per file in the change set, always present (an unreadable patch
                      manifest yields an empty array, with the reason in `patch`).
                    items: { $ref: "#/components/schemas/StructuredFile" }
                required: [patch, files]
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/ConfigInvalid" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/projects/{projectId}/change-sets/{id}/review:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - $ref: "#/components/parameters/ChangeSetId"
    post:
      tags: [change-sets]
      operationId: reviewChangeSet
      summary: Record the human verdict
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                verdict:
                  type: string
                  description: |
                    The wire vocabulary, which is not the CLI's: `idea review <id> approve` sends
                    `approved`. A client that posts `approve` or `reject` gets a 400.
                  enum: [approved, rejected, changes_requested]
                accept_findings:
                  type: boolean
                  description: |
                    With `approved`, sign off the adversarial reviewer's open findings on this
                    change set and approve **without re-running the review**. Re-approving runs a
                    fresh review, and a model reviewer is not a fixed point: after the first block
                    its findings are persisted and every later attempt is refused by the
                    `review_open_blocking` deny before the review runs, with no route out.

                    Only the reviewer's findings. A finding carrying a deny code — `secret_sweep`,
                    `pii`, `host_exec`, `blob_digest_mismatch` — is untouched, and so is one already
                    dispositioned (a failing build check is `rejected`, not a judgment to accept
                    away). The deny gate is re-run afterwards, so anything left alone still refuses.

                    Ignored without `approved`.
              required: [verdict]
      responses:
        default: { $ref: "#/components/responses/RoutingError" }
        "200":
          description: Reviewed.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, const: reviewed }
                required: [status]
        "400":
          description: |
            `verdict is required`, the engine's rejection of the verdict or the change set's
            state, or `json: unknown field "..."`. The body is closed: this operation decodes
            strictly and rejects any key it does not declare, so `acceptFindings` (camelCase)
            is a 400 rather than a silently-dropped field. Closed only up to Go's
            ASCII-case-insensitive field matching — `Verdict` is accepted as `verdict`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/ConfigInvalid" }
        "500": { $ref: "#/components/responses/InternalError" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/projects/{projectId}/change-sets/{id}/apply:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - $ref: "#/components/parameters/ChangeSetId"
    post:
      tags: [change-sets]
      operationId: applyChangeSet
      summary: Apply an approved change set to the workspace
      description: |
        Asynchronous, so the status guard runs here rather than in the background: a change set that
        is not `approved` is refused with 409 and a message that says what to do instead, rather
        than reporting "apply started" and failing where only the log would see it.
      responses:
        default: { $ref: "#/components/responses/RoutingError" }
        "202": { $ref: "#/components/responses/OperationAccepted" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/ConfigInvalid" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: |
            The change set cannot be applied from its current status, with the remedy named:
            `change set CHG-1 is already applied; \`idea revert CHG-1\` rolls it back`,
            `change set CHG-1 is being applied; \`idea changes\` shows when it lands`,
            `change set CHG-1 needs approval first: \`idea review CHG-1 approve\``,
            `change set CHG-1 was rejected; \`idea reviews\` shows why`, or
            `change set CHG-1 cannot be applied from status <status>`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/v1/projects/{projectId}/change-sets/{id}/revert:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - $ref: "#/components/parameters/ChangeSetId"
    post:
      tags: [change-sets]
      operationId: revertChangeSet
      summary: Roll an applied change set back
      description: Byte-for-byte, from the recorded journal entry. Asynchronous.
      responses:
        default: { $ref: "#/components/responses/RoutingError" }
        "202": { $ref: "#/components/responses/OperationAccepted" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/ConfigInvalid" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/v1/projects/{projectId}/change-sets/{id}/pr-checks:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - $ref: "#/components/parameters/ChangeSetId"
    get:
      tags: [change-sets]
      operationId: getChangeSetPRChecks
      summary: The latest CI status of the change set's initiative's pull request
      description: |
        Review C4 piece 3. Runs `gh pr checks` against the initiative's dedicated branch
        (`git.branch_per_initiative`); every change set of one initiative shares the same PR and so
        the same result. Synchronous: this is a read, not a mutation.
      responses:
        default: { $ref: "#/components/responses/RoutingError" }
        "200":
          description: The PR's latest CI status.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PRChecksResult" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/ConfigInvalid" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: |
            No pull request exists yet for this initiative (`idea pr` first), or the GitHub CLI
            (`gh`) is not installed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/v1/projects/{projectId}/change-sets/{id}/resolve-conflict:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - $ref: "#/components/parameters/ChangeSetId"
    post:
      tags: [change-sets]
      operationId: resolveChangeSetConflict
      summary: Resolve a conflicted change set
      description: |
        `retry` resets the change set to approved and re-applies it asynchronously - **202 with an
        operation id**. `reject` is synchronous and answers **200** with the rejected status. The
        two resolutions therefore have different status codes and different bodies.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                resolution:
                  type: string
                  enum: [retry, reject]
              required: [resolution]
      responses:
        default: { $ref: "#/components/responses/RoutingError" }
        "200":
          description: Rejected (the `reject` resolution).
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { $ref: "#/components/schemas/ChangeSetStatus" }
                required: [status]
        "202": { $ref: "#/components/responses/OperationAccepted" }
        "400":
          description: "`invalid body` or `resolution must be retry or reject`."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/ConfigInvalid" }
        "500": { $ref: "#/components/responses/InternalError" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: The change set is not in a state the chosen resolution can act on.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/v1/operations/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: Operation id, as returned by any 202 response.
        schema: { type: string }
    get:
      tags: [operations]
      operationId: getOperation
      summary: Status of one asynchronous operation
      description: |
        Not project-scoped: the daemon searches every registered project for the id, so polling
        works without knowing which project the operation belongs to.

        Poll until `status` leaves `pending`/`running`. A terminal `failed` carries no reason here -
        the initiative's `failure_reason` and `idea logs` do.
      responses:
        default: { $ref: "#/components/responses/RoutingError" }
        "200":
          description: The operation.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Operation" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404":
          description: "`operation not found` in any registered project."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/v1/operations/{id}/cancel:
    parameters:
      - name: id
        in: path
        required: true
        description: Operation id.
        schema: { type: string }
    post:
      tags: [operations]
      operationId: cancelOperation
      summary: Interrupt a running operation
      responses:
        default: { $ref: "#/components/responses/RoutingError" }
        "200":
          description: Cancellation was requested and recorded.
          content:
            application/json:
              schema:
                type: object
                properties:
                  operation_id: { type: string }
                  status: { $ref: "#/components/schemas/OperationStatus" }
                required: [operation_id, status]
        "401": { $ref: "#/components/responses/Unauthorized" }
        "500": { $ref: "#/components/responses/InternalError" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: |
            The operation exists but is not cancellable - already finished, or not interruptible.
            An operation id matching nothing answers `404`, like every other id-addressed route;
            until the next release the live-handle probe ran before the lookup, so an unknown id read as
            `409 is not running` - a claim about an operation that does not exist.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/v1/projects/{projectId}/providers:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    get:
      tags: [config]
      operationId: listProviders
      summary: Configured providers plus the unconfigured presets
      description: |
        Each entry carries its type, base URL, the **name** of the key environment variable, and a
        `ready` flag saying whether that key is present. Key values are never returned.

        For a ready provider the model list is fetched live from the provider's API (8s timeout)
        and falls back to the bundled catalog; configured models are always merged in. A rejected
        provider entry reports the endpoint requests will actually reach, and says why in `problem`.
      responses:
        default: { $ref: "#/components/responses/RoutingError" }
        "200":
          description: The provider view.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProvidersView" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/ConfigInvalid" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [config]
      operationId: updateProviders
      summary: Merge provider settings into harness.yaml
      description: |
        **Not round-trippable from `GET /providers`.** That response carries `demo`, `models` and
        `git_commit` alongside the writable fields, and its `providers` is an array of summaries
        rather than the map this takes — so sending it back verbatim answers
        `400 json: unknown field "demo"`. The writable set is exactly the properties below.
        The body is closed (see the 400), and closed only up to Go's ASCII-case-insensitive field
        matching: `Default_Model` is accepted as `default_model`, and a duplicate key is last-wins.

        A field-level merge, then a runtime reload. Only the fields this request writes are
        validated against the resulting config: a pre-existing problem elsewhere in `harness.yaml`
        is logged, not returned, so an unrelated problem cannot lock the operator out of the only
        endpoint that could fix it. An empty model spec for a role clears that role. Inline secrets
        are rejected at write time.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                default_model:
                  type: string
                  description: "`provider/model`. Empty leaves the current default in place."
                providers:
                  type: object
                  additionalProperties: { $ref: "#/components/schemas/ProviderConfig" }
                  description: Provider entries by name; each is validated before it is stored.
                models:
                  type: object
                  additionalProperties: { type: string }
                  description: Per-role model specs. An empty value deletes the role override.
                git_commit:
                  type: boolean
                  description: Omitted leaves the current value; null is treated as omitted.
                git_allow_default_branch:
                  type: boolean
                  description: |
                    harness.yaml `git.allow_default_branch` (review C4, adopted #2; wave 3
                    contract). Omitted leaves the current value; null is treated as omitted.
                git_branch_per_initiative:
                  type: boolean
                  description: |
                    harness.yaml `git.branch_per_initiative`. Omitted leaves the current value;
                    null is treated as omitted.
                review_rigor:
                  type: string
                  enum: [auto, quick, standard, thorough]
                  description: |
                    harness.yaml `review.rigor` (review B1). Omitted leaves the current value;
                    null is treated as omitted. Rejected with 400 if not one of the enum values.
      responses:
        default: { $ref: "#/components/responses/RoutingError" }
        "200":
          description: Written and reloaded.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, const: updated }
                  warnings:
                    type: array
                    items: { type: string }
                    description: |
                      Non-blocking problems attributable to a field this request wrote — a model id
                      absent from the bundled catalog, say. Same attribution rule as the 400: a
                      pre-existing warning elsewhere in the config is logged, not returned. Omitted
                      when empty. Clients should print these; the write still succeeded.
                required: [status]
        "400":
          description: |
            `invalid body`, a field this endpoint does not declare (the body is closed:
            `json: unknown field "api_key"`), a provider entry the validator refused — including one
            that resolves to no endpoint — a config problem attributable to a field this request
            wrote, or a rejected inline secret.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/ConfigInvalid" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "500":
          description: The config was written but the runtime reload failed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/v1/projects/{projectId}/models:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    get:
      tags: [config]
      operationId: listModels
      summary: List one provider's models
      description: |
        Live from the provider, falling back to the bundled catalog. With no `provider` the default
        model's provider is used, and `openai` if there is no default. A provider that cannot be
        reached answers 200 with an empty `models` array rather than an error.
      parameters:
        - name: provider
          in: query
          required: false
          description: Provider name, e.g. `openai`, `anthropic`.
          schema: { type: string }
      responses:
        default: { $ref: "#/components/responses/RoutingError" }
        "200":
          description: The provider that was consulted and its models.
          content:
            application/json:
              schema:
                type: object
                properties:
                  provider: { type: string }
                  models:
                    type: array
                    items: { type: string }
                required: [provider, models]
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/ConfigInvalid" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/projects/{projectId}/executors:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    get:
      tags: [config]
      operationId: listExecutors
      summary: Available executors and their declared capabilities
      description: Every known executor is listed; `selected` marks the configured one.
      responses:
        default: { $ref: "#/components/responses/RoutingError" }
        "200":
          description: The executors.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ExecutorView" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/ConfigInvalid" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [config]
      operationId: updateExecutors
      summary: Merge executor settings into harness.yaml
      description: |
        **`GET /executors` is not the read side of this.** It returns a catalog of all four
        executor kinds with their capabilities, not a projection of the config, so there is no
        round trip to perform: its per-item key is `name`, this takes `kind`, and echoing an entry
        back answers `400 json: unknown field "capabilities"`. The writable set is the three
        properties below.

        Field-level merge of `kind`, `image` and `model`, validated, written, then reloaded. The
        config is re-read from disk first so a hand-edited `harness.yaml` is not clobbered. `image`
        and `model` are nullable pointers: omit to leave alone, send `""` to clear.

        For `kind` `hermes`/`omp` with the resulting `image` empty, the pinned default
        (`executor.DefaultAgentImage`) is stored instead of leaving it empty — reload shows what is
        actually stored, and the daemon's own runtime fallback for an empty image is the same
        pinned default, never `alpine:3.20` (which has no agent CLI). For `hermes`/`omp` with a
        non-empty `model`, the model must resolve to a provider through
        `executor.ResolveAgentProvider` (the project's `providers:` entries plus `default_model`);
        an unresolvable model is rejected with `400` naming the reason, rather than being written
        and failing later inside the agent container.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                kind: { $ref: "#/components/schemas/ExecutorKind" }
                image:
                  type: string
                  description: Container image reference; must contain no whitespace. Empty clears it.
                model:
                  type: string
                  description: Model spec for agent executors. Empty clears it.
      responses:
        default: { $ref: "#/components/responses/RoutingError" }
        "200":
          description: Written and reloaded.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, const: updated }
                  warnings:
                    type: array
                    items: { type: string }
                    description: |
                      Non-blocking problems with the fields this request wrote — a model id absent
                      from the bundled catalog, say. Omitted when empty; the write still succeeded.
                required: [status]
        "400":
          description: "`invalid body`, `invalid executor kind \"...\"`, `invalid executor image`, or a rejected write."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/ConfigInvalid" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: "`config written but not applied (reload failed): ...` - the file changed but the runtime did not."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/v1/projects/{projectId}/executors/smoke:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    post:
      tags: [config]
      operationId: smokeExecutor
      summary: Run the coding agent's smoke test
      description: |
        Runs a trivial task through the configured coding agent -- it must write one file -- as an
        operation of type `executor_smoke`, with exactly what a real run would use: the configured
        kind and image, the implementer's model and provider, and the daemon's own keys (its
        environment, then the project's `.env`). **It makes one small real model call.**
        `idea executors setup --smoke` does the same from the CLI, in the CLI's environment.

        The operation carries no `initiative_id`. It fails with the smoke's own error, which
        includes the agent's output (redacted). The latest result is reported as
        `status.last_smoke` on `GET /executors`. One smoke runs per project at a time.
      responses:
        default: { $ref: "#/components/responses/RoutingError" }
        "202": { $ref: "#/components/responses/OperationAccepted" }
        "400":
          description: The executor is not a coding agent (`internal`, `container`), has no image, or its model resolves to no usable provider.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: A smoke test is already running for this project.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422": { $ref: "#/components/responses/ConfigInvalid" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/v1/projects/{projectId}/activity:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    get:
      tags: [events]
      operationId: getActivity
      summary: The raw event timeline
      description: |
        The first 200 events from sequence 0, ungrouped and unnarrated - unlike `/changed`, and
        including the machinery events `/changed` hides.
      responses:
        default: { $ref: "#/components/responses/RoutingError" }
        "200":
          description: The events.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Event" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/ConfigInvalid" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/v1/projects/{projectId}/events:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    get:
      tags: [events]
      operationId: streamEvents
      summary: SSE stream of product-graph events
      description: |
        **Not JSON.** `text/event-stream`, one event per product-graph event, with the event
        sequence as the SSE id. `Last-Event-ID` resumes from a sequence. The stream polls the store
        once a second and pushes up to 200 events per tick, so it is at-least-once catch-up rather
        than a true push.

        **This is the one path that accepts the token as a query parameter** (`?token=`), because
        `EventSource` cannot set request headers. Everywhere else the header is required, so the
        token never reaches logs, shell history or a `Referer`.
      security:
        - ideaToken: []
        - bearerToken: []
        - sseQueryToken: []
      parameters:
        - name: token
          in: query
          required: false
          description: The API token, for `EventSource` clients that cannot set a header.
          schema: { type: string }
        - name: Last-Event-ID
          in: header
          required: false
          description: Resume from this event sequence. Unparseable values are treated as 0.
          schema: { type: integer, format: int64 }
      responses:
        default: { $ref: "#/components/responses/RoutingError" }
        "200":
          description: The stream.
          content:
            text/event-stream:
              schema:
                type: string
                description: "`id: <seq>` and `data: <Event as JSON>` per event."
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/ConfigInvalid" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500":
          description: "`streaming unsupported` - the response writer cannot flush."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

components:
  securitySchemes:
    ideaToken:
      type: apiKey
      in: header
      name: X-Idea-Token
      description: |
        The per-install API token, the daemon's sole credential (`auth`, `internal/daemon/server.go`).

        - **Source**: `~/.local/share/idea-harness/token`, mode 0600, generated per install.
          `IDEA_HARNESS_STATE` relocates the state root. The daemon also substitutes the token into
          the UI's `index.html` at serve time, so the same-origin UI can authenticate its own
          `fetch` calls.
        - **Comparison** is constant-time (`security.TokenEqual`).
        - **Scope**: every path under `/api/`. Paths outside `/api/` are the embedded UI's own
          assets and carry no token check at all.
        - **Exemption**: `GET /api/v1/health` is served without a token, so `idea doctor` and CI can
          probe a daemon they have no token for.
        - A missing or wrong token is `401 {"error": "unauthorized"}`.
    bearerToken:
      type: http
      scheme: bearer
      description: |
        The same token, accepted as `Authorization: Bearer <token>` for convenience. It is only
        consulted when `X-Idea-Token` is absent.
    sseQueryToken:
      type: apiKey
      in: query
      name: token
      description: |
        The same token as a query parameter, accepted **only** on
        `GET /api/v1/projects/{projectId}/events` - the SSE stream - because the browser's
        `EventSource` API cannot set request headers. It is consulted only when neither header is
        present. Every other endpoint requires a header, so the token never appears in a URL and so
        never reaches server logs, shell history or a `Referer`.

  parameters:
    ProjectId:
      name: projectId
      in: path
      required: true
      description: Project id from `POST /api/v1/projects` or `GET /api/v1/projects`.
      schema: { type: string }
    InitiativeId:
      name: id
      in: path
      required: true
      description: Initiative id. Every initiative-scoped route names this path parameter `id`.
      schema: { type: string }
    TaskId:
      name: taskId
      in: path
      required: true
      description: Task id. A task belonging to another initiative is refused by the editable guard.
      schema: { type: string }
    StaleId:
      name: staleId
      in: path
      required: true
      description: Stale-mark id, as returned in `stale_items[].id` on `/guidance`.
      schema: { type: string }
    DecisionId:
      name: id
      in: path
      required: true
      description: Decision id.
      schema: { type: string }
    ChangeSetId:
      name: id
      in: path
      required: true
      description: Change set human id (`CHG-1`) or internal id - both resolve.
      schema: { type: string }
    ArtifactVersionId:
      name: id
      in: path
      required: true
      description: Artifact **version** id, as returned in the `id` field of the artifacts list.
      schema: { type: string }
    GraphNodeType:
      name: type
      in: query
      required: true
      description: Graph node type, e.g. `requirement`, `task`, `decision`, `assertion`, `change_set`.
      schema: { type: string }
    GraphNodeId:
      name: id
      in: query
      required: true
      description: |
        Graph node id — the opaque 32-hex id, **not** the human code. A code such as `REQ-1`
        returns `200 []`, which is indistinguishable from a node with no provenance. Resolve it
        through the initiative's own listing first. `ChangeSetId` accepts both forms; this does
        not, and the difference is not currently reconciled.
      schema: { type: string }

  responses:
    Unauthorized:
      description: "`401 {\"error\": \"unauthorized\"}` - the token was missing or wrong."
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    RoutingError:
      description: |
        Any status this operation does not declare. In practice: `403` from the host/origin guard,
        and `405` with an `Allow` header when the path exists but the method does not — both
        emitted uniformly at the routing layer for every path under `/api/`, which is why they are
        not repeated on each operation.

        Declared as `default` so a generated client has somewhere to put them. Without it an
        undeclared status is an unhandled branch in most generators, which is the concrete cost the
        `Error` schema's own note used to describe and not address.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    ConfigInvalid:
      description: |
        `harness.yaml` in the project root could not be parsed. The message names the file and the
        YAML parser's line, and never an absolute path.

        A 4xx rather than a 500: the request cannot succeed until the user edits the file, so
        telling a client to retry would be wrong, and `InternalError` is reserved for the daemon's
        own faults. Every project-scoped operation can answer this, because the config is loaded
        while resolving the project. It previously surfaced as a **404** — neither a store miss nor
        a message naming a kind and a reference — carrying the absolute path of the file.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: |
        A store miss. The message names the kind and the reference that was asked for -
        `no change set matching "CHG-99"` - because `writeErr` classifies the error rather than
        trusting the handler's status. A lookup that reached the daemon unwrapped degrades to
        `not found`. An unknown `projectId` lands here too.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Conflict:
      description: The requested transition is not legal from the current state; the message says why.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    PayloadTooLarge:
      description: |
        `document too large` or `body too large`. A single document's content is capped at 2 MiB and
        the request body at that plus 64 KiB of framing.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    InternalError:
      description: |
        A storage or filesystem failure: `internal error (correlation id: a1b2c3d4e5f6)`. The full
        error is logged server-side under that id (`idea logs`), so driver text, constraint names
        and absolute state paths never reach the client. A **domain** error that a handler passed
        with status 500 keeps its own message instead - `writeErr` masks only storage failures.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    TraceParamsRequired:
      description: "`type and id query params are required`."
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    TaskNotEditable:
      description: |
        The plan is not editable, or this task is not:
        `tasks are editable only after the plan is drafted and before it is executed`,
        `the initiative has work in progress; wait for it to finish`,
        `task does not belong to this initiative`,
        `task is done and cannot be edited`, or
        `task already has change sets and cannot be edited`.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    OperationAccepted:
      description: |
        Accepted. The work runs asynchronously; poll `GET /api/v1/operations/{operation_id}` or
        follow the project's SSE stream.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/OperationAccepted" }

  schemas:
    DocComment:
      type: object
      description: |
        A comment on one immutable artifact version (`domain.DocComment`). Section and text are
        redacted on the way in. Once promoted, `promoted_question_id` names the question it became.
      properties:
        id: { type: string }
        initiative_id: { type: string }
        artifact_version_id: { type: string }
        section: { type: string }
        text: { type: string }
        author: { type: string }
        promoted_question_id: { type: string }
        created_at: { type: string, format: date-time }
    InitiativeRollup:
      type: object
      description: |
        A cross-initiative summary (`store.InitiativeRollup`). It carries the phase-derivation
        inputs as flat lists rather than whole objects, because the caller only counts and
        classifies them.
      properties:
        id: { type: string }
        title: { type: string }
        status: { $ref: "#/components/schemas/InitiativeStatus" }
        judgment_reason:
          allOf: [{ $ref: "#/components/schemas/JudgmentReason" }]
          description: |
            Why the initiative is parked. All four reasons share `needs_human_judgment`, so the
            status alone cannot tell a PRD-review park from a plan-stage one - and the phase rail
            this rollup feeds would otherwise have to infer it from artifact presence, which is
            wrong for a plan whose dependencies never resolved. Omitted when empty.
        artifacts:
          type: array
          items:
            type: object
            properties:
              kind: { type: string }
              version: { type: integer }
        task_statuses:
          type: array
          items: { type: string }
          description: One entry per task - the status values, not the tasks.
        change_set_statuses:
          type: array
          items: { type: string }
        open_decisions: { type: integer }
        open_questions: { type: integer }
        open_findings: { type: integer }
        verified_requirements: { type: integer }
    Error:
      type: object
      title: Error
      description: |
        Every error response in this API has this shape and nothing else - no code, no details
        object. Status selection is centralized: a store miss is 404 naming the reference, a storage
        failure is 500 with a correlation id and a generic message, and every other (domain) error
        keeps its own message and the status its handler chose. Handlers that validate their own
        request bodies write 400 directly.

        This now holds at the routing layer too, and it distinguishes the two cases it used to
        conflate. A path under `/api/` that no route claims answers `404` in this shape, rather
        than the file server's `text/plain` "404 page not found". A path that exists but was
        called with the wrong method answers `405` with an `Allow` header naming the methods it
        does accept — previously indistinguishable from a typo, because the catch-all registered
        for `/` matched everything and Go synthesizes `405` only when nothing matches.

        Neither is declared per operation below: they apply uniformly to every path under
        `/api/`, and repeating them 97 times would say less than saying it once here. `403` is the
        same shape and comes from the host/origin guard rather than the router.

        Every operation does carry a `default` response, so a generated client has somewhere to put
        all three rather than leaving an unhandled branch — which was the real cost of stating them
        only in prose.
      properties:
        error:
          type: string
          description: A message written to be read by a human.
      required: [error]
      examples:
        - { error: 'no change set matching "CHG-99"' }
        - { error: "internal error (correlation id: a1b2c3d4e5f6)" }
        - { error: "unauthorized" }

    OperationAccepted:
      type: object
      title: OperationAccepted
      properties:
        operation_id: { type: string }
      required: [operation_id]

    BuildInfo:
      type: object
      title: BuildInfo
      description: The binary's build stamp (`buildinfo.Info`).
      properties:
        version:
          type: string
          description: A release version, a module version from the proxy, or `dev`.
        commit:
          type: string
          description: VCS revision, omitted when unknown.
        modified:
          type: boolean
          description: True when built from a dirty working tree; omitted when false.
      required: [version]

    ProjectRecord:
      type: object
      title: ProjectRecord
      description: One entry in the global project registry (`store.ProjectRecord`).
      properties:
        id: { type: string }
        name: { type: string }
        root_path: { type: string }
        project_id:
          type: string
          description: The id used in every `/projects/{projectId}` path.
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
      required: [id, name, root_path, project_id, created_at, updated_at]

    InitiativeStatus:
      type: string
      title: InitiativeStatus
      enum: [running, needs_human_judgment, approved, plan_approved, failed, complete]

    Initiative:
      type: object
      title: Initiative
      description: One initiative - the unit of work the whole API is scoped to (`domain.Initiative`).
      properties:
        id: { type: string }
        project_id: { type: string }
        title: { type: string }
        short_title:
          type: string
          description: |
            A deterministically generated short label (<=60 chars, C1, wave 3 contract): the idea's
            first sentence or clause, trimmed at a word boundary, with a common lead-in ("I want
            to", "Build") dropped. `title`/`description` keep the full prompt; clients show
            `short_title || title`. Generated on create, and backfilled the same way for
            initiatives created before this field existed.
        description: { type: string }
        status: { $ref: "#/components/schemas/InitiativeStatus" }
        failure_reason:
          type: string
          description: Present only on a failed initiative.
        judgment_reason:
          allOf:
            - $ref: "#/components/schemas/JudgmentReason"
          description: |
            Why the initiative is waiting on a human. Set only while `status` is
            `needs_human_judgment`, and absent or empty on a row parked before this field
            existed.
        git_branch:
          type: string
          description: |
            The dedicated branch (`idea/<slug>`) this initiative's change sets commit to when
            `git.branch_per_initiative` is on. Set on the initiative's first apply and reused by
            every later one. Empty when the setting is off, or before a first apply has created it.
        pr_url:
          type: string
          description: |
            The pull request `POST .../initiatives/{id}/pr` opened for `git_branch`. Empty until a
            PR exists; a repeat call is idempotent and returns this URL rather than opening a
            second PR.
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
      required: [id, title, description, status, created_at, updated_at]

    JudgmentReason:
      type: string
      title: JudgmentReason
      description: |
        Why an initiative is in `needs_human_judgment`. The four are not interchangeable:
        `prd_review` and `plan_review` are resolved by accepting or regenerating the artifact,
        `plan_dependencies` **only** by regenerating - approving there locks in a dependency
        graph already known to be incomplete and leaves a blocking finding that wedges
        completion - and `verification` by recording evidence, not by touching the plan.
      enum: [prd_review, plan_dependencies, plan_review, verification]

    TrustLevel:
      type: string
      title: TrustLevel
      enum:
        - system
        - policy
        - human_approved
        - reviewed_agent_output
        - unreviewed_agent_output
        - external_untrusted

    Confidence:
      type: string
      title: Confidence
      enum: [high, medium, low]

    ProvenanceRef:
      type: object
      title: ProvenanceRef
      description: One source behind a statement.
      properties:
        kind: { type: string }
        id: { type: string }
        digest: { type: string }
        trust: { $ref: "#/components/schemas/TrustLevel" }
      required: [kind, id, trust]

    AcceptanceCriterion:
      type: object
      title: AcceptanceCriterion
      properties:
        metric: { type: string }
        target: { type: string }
        condition: { type: string }
      required: [metric, target, condition]

    RequirementPriority:
      type: string
      title: RequirementPriority
      enum: [must, should, could]

    RequirementStatus:
      type: string
      title: RequirementStatus
      description: |
        `failed` is a human "fail" judgment — the requirement stays in the active set and blocks
        completion until re-verified. `waived` is a human "waive" — out of scope, excluded from the
        completion gate like `removed`, but retained as a visible judgment rather than deleted.
      enum: [draft, approved, verified, failed, waived, removed]

    Requirement:
      type: object
      title: Requirement
      description: One requirement with its acceptance criteria and provenance (`domain.Requirement`).
      properties:
        id: { type: string }
        initiative_id: { type: string }
        code:
          type: string
          description: The human-facing code, e.g. `REQ-3`.
        statement: { type: string }
        acceptance_criteria:
          type: array
          items: { $ref: "#/components/schemas/AcceptanceCriterion" }
        priority: { $ref: "#/components/schemas/RequirementPriority" }
        status: { $ref: "#/components/schemas/RequirementStatus" }
        source_assertion_id: { type: string }
        provenance:
          type: array
          items: { $ref: "#/components/schemas/ProvenanceRef" }
        produced_by_run: { type: string }
        superseded_by: { type: string }
        verified_at:
          type: [string, "null"]
          format: date-time
        evidence_tests:
          type: array
          description: |
            Test-run evidence mapped to this requirement (C2, wave 3 contract): every test the
            verification plan names for it, or that names its code, resolved against the most
            recent parsed check result. Computed at read time from the "tests" check's output,
            never persisted, so it reflects the last check run. Absent means no test is known to
            cover this requirement yet, not that one failed.
          items: { $ref: "#/components/schemas/EvidenceTest" }
        created_at: { type: string, format: date-time }
      required: [id, initiative_id, code, statement, acceptance_criteria, priority, status, provenance, created_at]

    EvidenceTest:
      type: object
      title: EvidenceTest
      description: One test-run result mapped to a requirement (C2, wave 3 contract).
      properties:
        name: { type: string }
        status:
          type: string
          enum: [passed, failed]
        change_set:
          type: string
          description: The `human_id` (e.g. `CHG-2`) of the change set this result came from.
      required: [name, status, change_set]

    Assertion:
      type: object
      title: Assertion
      description: One provenance-backed statement about the problem (`domain.Assertion`).
      properties:
        id: { type: string }
        initiative_id: { type: string }
        type:
          type: string
          enum: [fact, assumption, hypothesis]
        status:
          type: string
          enum: [candidate, accepted, disputed, retracted, superseded]
        statement: { type: string }
        evidence_digest: { type: string }
        confidence: { $ref: "#/components/schemas/Confidence" }
        source: { type: string }
        provenance:
          type: array
          items: { $ref: "#/components/schemas/ProvenanceRef" }
        produced_by_run: { type: string }
        superseded_by: { type: string }
        created_at: { type: string, format: date-time }
      required: [id, initiative_id, type, status, statement, confidence, source, provenance, created_at]

    Decision:
      type: object
      title: Decision
      properties:
        id: { type: string }
        initiative_id: { type: string }
        code: { type: string }
        type:
          type: string
          enum: [product, architecture, design, security, operations]
        question: { type: string }
        options:
          type: array
          items: { type: string }
        recommendation: { type: string }
        status:
          type: string
          enum: [open, decided, superseded]
        resolution: { type: string }
        resolved_by: { type: string }
        provenance:
          type: array
          items: { $ref: "#/components/schemas/ProvenanceRef" }
        superseded_by: { type: string }
        created_at: { type: string, format: date-time }
      required: [id, initiative_id, code, type, question, options, recommendation, status, provenance, created_at]

    DecisionDiscussion:
      type: object
      title: DecisionDiscussion
      description: One turn in a decision's discussion thread.
      properties:
        id: { type: string }
        decision_id: { type: string }
        author: { type: string }
        message: { type: string }
        created_at: { type: string, format: date-time }
      required: [id, decision_id, author, message, created_at]

    Question:
      type: object
      title: Question
      properties:
        id: { type: string }
        initiative_id: { type: string }
        question: { type: string }
        status:
          type: string
          enum: [open, resolved]
        answer_digest:
          type: string
          description: The answer is stored content-addressed; only its digest is on the row.
        answered_by: { type: string }
        created_at: { type: string, format: date-time }
        resolved_at:
          type: [string, "null"]
          format: date-time
      required: [id, initiative_id, question, status, created_at]

    TriageItem:
      type: object
      title: TriageItem
      description: One ranked open judgment item (review B4's triage view).
      properties:
        type:
          type: string
          enum: [decision, question, finding]
        id: { type: string }
        label: { type: string }
        blocking:
          type: boolean
          description: Findings only -- an open decision/question is never "blocking" in this sense.
        severity:
          allOf:
            - $ref: "#/components/schemas/Severity"
          description: Findings only; empty for a decision or question.
        dependents:
          type: integer
          description: How many requirements cite this open decision. Always 0 for a question or a finding today.
        rank:
          type: string
          enum: [priority, optional]
          description: "`priority` for the top 3 by impact (blocking, then severity, then dependents); `optional` for the rest."
      required: [type, id, label, blocking, dependents, rank]

    SuggestedAnswer:
      type: object
      title: SuggestedAnswer
      properties:
        question_id: { type: string }
        question: { type: string }
        answer: { type: string }
      required: [question_id, question, answer]

    ArtifactKind:
      type: string
      title: ArtifactKind
      enum:
        - idea_brief
        - research_brief
        - prd
        - technical_design
        - design_spec
        - verification_plan
        - threat_model
        - execution_plan
        - operational_readiness
        - verification_report

    ArtifactVersion:
      type: object
      title: ArtifactVersion
      description: |
        One artifact version (`store.ArtifactView`). `id` is the **version** id - the value
        `/artifacts/{id}/body` and `/artifacts/{id}/raw` take.
      properties:
        id: { type: string }
        artifact_id: { type: string }
        kind: { $ref: "#/components/schemas/ArtifactKind" }
        version: { type: integer }
        status: { type: string }
        body_digest: { type: string }
        produced_by_run: { type: string }
        created_at: { type: string, format: date-time }
      required: [id, artifact_id, kind, version, status, body_digest, produced_by_run, created_at]

    ContextDoc:
      type: object
      title: ContextDoc
      description: One ingested context document. Bodies live in the blob store; only a preview is on the row.
      properties:
        id: { type: string }
        initiative_id: { type: string }
        kind:
          type: string
          description: Free-form category, redacted and truncated to 64 runes; `other` by default.
        title:
          type: string
          description: Redacted and truncated to 200 runes; `untitled` by default.
        digest: { type: string }
        preview:
          type: string
          description: First 200 runes of the redacted text; empty for an image doc.
        format:
          type: string
          description: "`image` for an image upload; empty for a text doc."
        description_digest:
          type: string
          description: Digest of the vision-generated description, once it has been produced.
        created_at: { type: string, format: date-time }
      required: [id, initiative_id, kind, title, digest, preview, format, created_at]

    Severity:
      type: string
      title: Severity
      enum: [critical, high, medium, low, observation]

    Disposition:
      type: string
      title: Disposition
      enum: [fixed, accepted_risk, not_applicable, duplicate, deferred, rejected, mitigate, not_a_secret]
      description: |
        `not_a_secret` is valid only on a `secret_sweep` finding (review changes #1): recording it
        allowlists the finding's fingerprint for the project, so a future sweep ignores that same
        value. Every other target refuses it with 400.

    Finding:
      type: object
      title: Finding
      description: |
        One review or audit finding (`domain.Finding`). The same shape carries change-set review
        findings and the traceability gaps returned by `/doctor`.
      properties:
        id: { type: string }
        initiative_id: { type: string }
        review_run_id: { type: string }
        target_type:
          type: string
          description: What the finding is about, e.g. `change_set`, `task`, `requirement`.
        target_id: { type: string }
        severity: { $ref: "#/components/schemas/Severity" }
        confidence: { $ref: "#/components/schemas/Confidence" }
        category:
          type: string
          description: "`patch_applies`, `build` and `tests` are the categories `/checks` projects."
        code:
          type: string
          description: Deny code, when the finding came from a policy gate.
        finding: { type: string }
        evidence: { type: string }
        impact: { type: string }
        recommendation: { type: string }
        disposition: { $ref: "#/components/schemas/Disposition" }
        disposition_actor: { type: string }
        note: { type: string }
        secret_fingerprint:
          type: string
          description: |
            Set only on a `secret_sweep` finding raised from a per-file credential match: a
            per-project HMAC-SHA256 of the matched value's capture group (review H3 -- never a bare
            sha256, which would be the same, precomputable value across every installation that
            ever saw the same secret). Never the value itself. Scoped together with `secret_path`
            when disposed `not_a_secret`: the allowlist entry it creates only suppresses this exact
            fingerprint at this exact path.
        secret_kind:
          type: string
          description: The kind of secret matched, e.g. "looks like an OpenAI API key". Set alongside `secret_fingerprint`.
        secret_path:
          type: string
          description: |
            The `path:line`-bearing file the match was found in, or a synthetic path such as
            "output of build" for a match found in a deterministic check's captured output rather
            than a file. Set alongside `secret_fingerprint`.
        secret_overridable:
          type: boolean
          description: |
            Whether this finding is even eligible for a `not_a_secret` disposition (review H3):
            `true` for an ordinary pattern-shaped match (might be a false positive), `false` for a
            value drawn from the project's own configured secrets -- a real credential by
            construction. The store refuses `not_a_secret` outright when this is `false`. Only
            meaningful on a `secret_sweep` finding.
        secret_preview:
          type: string
          description: |
            A masked preview of the matched value (review H3): the first 4 and last 4 characters,
            the rest replaced by a single ellipsis (e.g. `sk-p…Xy9z`); a value of 8 characters or
            fewer is masked entirely. Never the raw value. Set alongside `secret_fingerprint`.
        path:
          type: string
          description: |
            The file this finding is about, self-reported by the reviewer (change-set review
            only; review B2). Optional.
        in_diff:
          type: boolean
          description: |
            Self-report: whether this finding is about code the change set actually touches.
            Only consulted when `path` is empty; defaults to `true` when the reviewer omits it
            entirely, so an older prompt or a scripted response is never silently downgraded
            (review B2).
        advisory:
          type: boolean
          description: |
            Never blocks approval, whatever the severity (review B1, B2). Set when: a rigor cap
            dropped lower-severity findings this cycle (the note on THIS finding names how many);
            a `path` is not one of the change set's files ("about code this change set did not
            touch"); or, with no `path`, `in_diff` is `false` ("unverified").
        created_at: { type: string, format: date-time }
      required: [id, review_run_id, target_type, target_id, severity, confidence, category, finding, evidence, impact, recommendation, created_at]

    SecretAllowlistEntry:
      type: object
      title: SecretAllowlistEntry
      description: |
        One human "not a secret" override (review changes #1, review H3), as
        `GET .../secret-allowlist` projects it: fingerprint prefix, kind, path at the time, actor,
        created_at. Recorded when a `secret_sweep` finding is dispositioned `not_a_secret`, scoped
        to (fingerprint, path) together -- the same value allowlisted at one path still blocks at
        another.
      properties:
        id: { type: string }
        fingerprint_prefix:
          type: string
          description: |
            The first characters of the per-project HMAC fingerprint (review H3; not a bare
            sha256) -- enough to tell entries apart, never the full digest.
        kind:
          type: string
          description: The kind of secret matched, e.g. "looks like an OpenAI API key".
        path:
          type: string
          description: The file the match was found in, at the time of the disposition.
        actor:
          type: string
          description: Always `human` -- not_a_secret requires a human actor.
        created_at: { type: string, format: date-time }
      required: [id, fingerprint_prefix, kind, path, actor, created_at]

    TaskStatus:
      type: string
      title: TaskStatus
      enum: [proposed, ready, blocked, done, cancelled]

    Task:
      type: object
      title: Task
      description: One unit of the execution plan (`domain.Task`).
      properties:
        id: { type: string }
        initiative_id: { type: string }
        code:
          type: string
          description: The human-facing code, e.g. `TASK-2`.
        title: { type: string }
        statement: { type: string }
        status: { $ref: "#/components/schemas/TaskStatus" }
        priority: { $ref: "#/components/schemas/RequirementPriority" }
        estimate: { type: string }
        produced_by_run: { type: string }
        superseded_by: { type: string }
        requirement_ids:
          type: array
          items: { type: string }
          description: |
            The requirement ids this task implements (N:M, review A4 #3/#4). Computed at read
            time from the task's `implements` graph edges; always an array, never `null`.
        depends_on:
          type: array
          items: { type: string }
          description: |
            The task ids this task depends on. Computed at read time from the task's `depends_on`
            graph edges; always an array, never `null`.
        created_at: { type: string, format: date-time }
      required: [id, initiative_id, code, title, statement, status, priority, requirement_ids, depends_on, created_at]

    ChangeSetStatus:
      type: string
      title: ChangeSetStatus
      enum:
        - draft
        - checks_running
        - review_required
        - rejected
        - changes_requested
        - superseded
        - approved
        - applying
        - applied
        - reverted
        - conflicted

    ChangeSet:
      type: object
      title: ChangeSet
      description: |
        The source-mutation primitive (`domain.ChangeSet`). Only an `approved` change set can be
        applied; the patch itself is fetched from `/change-sets/{id}/diff`.
      properties:
        id: { type: string }
        human_id:
          type: string
          description: The id humans use, e.g. `CHG-1`. Either id addresses the change set in a path.
        initiative_id: { type: string }
        task_id: { type: string }
        base_snapshot_id: { type: string }
        status: { $ref: "#/components/schemas/ChangeSetStatus" }
        patch_digest: { type: string }
        review_id: { type: string }
        git_commit_sha:
          type: string
          description: Set when the harness is configured to commit applied change sets.
        git_commit_warning:
          type: string
          description: |
            Set instead of `git_commit_sha` when `git_commit` is on but the commit-on-apply guard
            refused (review C4): a detached HEAD, a rebase/merge/cherry-pick in progress, or the
            repository's default branch without `git.allow_default_branch`. The change set still
            applies; only the commit is skipped.
        created_by_run_id: { type: string }
        model:
          type: string
          description: |
            The actual model that produced this change set, e.g. `openai/gpt-5`, or the literal
            string `demo` when no real provider was configured (the internal registry key is never
            exposed as a model id). The UI keys `model === "demo"` to label the change "Shipped
            (demo)" / "Placeholder change" rather than real agent output.
        executor:
          type: string
          description: |
            The executor kind that produced this change set (`internal`, `container`, `omp`,
            `hermes`). `internal` output is a placeholder whatever the model. Empty for change sets
            made before this field existed.
        agent_output:
          type: string
          description: |
            The end of the coding agent's own output for the run that produced this change set: the
            last 100 lines, escape sequences stripped, known secrets redacted. Omitted for executors
            with no agent output and for change sets made before this field existed.
        created_at: { type: string, format: date-time }
      required: [id, human_id, initiative_id, task_id, status, patch_digest, created_at]

    PRChecksResult:
      type: object
      title: PRChecksResult
      description: |
        `gh pr checks`'s result for one pull request (review C4 piece 3, `git.PRChecksResult`).
      properties:
        overall:
          type: string
          description: |
            `success` (every check passed), `failure` (at least one failed), `pending` (none
            failed, at least one still running), or `none` (no checks reported at all).
          enum: [success, failure, pending, none]
        checks:
          type: array
          items:
            type: object
            properties:
              name: { type: string }
              state:
                type: string
                description: e.g. `SUCCESS`, `FAILURE`, `PENDING`, `SKIPPED`, as `gh` reports it.
              link: { type: string }
            required: [name, state]
      required: [overall, checks]

    StructuredFile:
      type: object
      title: StructuredFile
      description: |
        One file of a change set, for per-file display (`workflow.StructuredFile`). `content` is
        redacted at this display surface; the raw store keeps the unredacted bytes so apply and
        revert round-trip byte-for-byte. A deleted file carries no content, and content is also
        absent (with `size` 0) when the produced bytes were never persisted - a change set rejected
        by the secret sweep, for example. The post-image digest is deliberately not exposed.
      properties:
        path: { type: string }
        change_type:
          type: string
          description: How the file changed.
          enum: [add, modify, delete]
        size:
          type: integer
          description: Byte length of the stored content, 0 when no content is available.
        content:
          type: string
          description: Redacted file content; empty for a deletion.
        patch:
          type: string
          description: |
            A git-style unified diff of the file against the version the agent started from, without
            file headers: hunks headed `@@ -a,b +c,d @@`, each line prefixed with one character
            (` ` context, `-` removed, `+` added), three lines of context. An added file is one hunk
            `@@ -0,0 +1,N @@`; a deleted file is `@@ -1,N +0,0 @@`. The base comes from the raw blob
            store after apply, or from the workspace file before apply - only while that file still
            matches the recorded base digest. Omitted when there is no change to show, or when
            `patch_note` explains why there is no diff.
        patch_note:
          type: string
          description: |
            Why `patch` is absent although the file changed: binary, too large to diff, content not
            kept, or the base no longer recoverable because the workspace file was edited after the
            agent ran. Clients show it and fall back to `content`.
      required: [path, change_type, size, content]

    OperationStatus:
      type: string
      title: OperationStatus
      enum: [pending, running, succeeded, failed, cancelled]

    Operation:
      type: object
      title: Operation
      description: |
        One asynchronous unit of work (`domain.Operation`), created by every 202 endpoint. Poll it
        until `status` is `succeeded`, `failed` or `cancelled`.
      properties:
        id: { type: string }
        project_id: { type: string }
        initiative_id: { type: string }
        type:
          type: string
          description: Which pipeline this operation runs, e.g. `advance`, `execute`, `apply`.
        status: { $ref: "#/components/schemas/OperationStatus" }
        result_ref: { type: string }
        error:
          type: string
          description: |
            Why a `failed` or `cancelled` operation ended that way, redacted and capped around
            8 KB. Omitted (never an empty string) on a `succeeded`, `pending` or `running`
            operation. Before this field existed, a failed execute left the running card with
            nothing to show and the only record of why was a line in daemon.log.
        stage:
          type: string
          description: |
            The engine's current step (C3, wave 3 contract), e.g. "Writing the PRD", "Reviewing
            the plan (cycle 2)", "Agent running TASK-2", "Running checks". Set by a callback as
            the engine moves between steps; simply stops changing once the operation reaches a
            terminal status. The CLI's wait loop prints it in place of a bare "still working…".
        created_at: { type: string, format: date-time }
        finished_at:
          type: [string, "null"]
          format: date-time
      required: [id, project_id, type, status, created_at]

    Event:
      type: object
      title: Event
      description: One row of the append-only event log (`store.EventRow`), also the SSE payload.
      properties:
        seq:
          type: integer
          format: int64
          description: Monotonic sequence; also the SSE event id and the `Last-Event-ID` value.
        id: { type: string }
        aggregate_type: { type: string }
        aggregate_id: { type: string }
        actor: { type: string }
        correlation_id: { type: string }
        causation_id: { type: string }
        operation: { type: string }
        event_type: { type: string }
        payload_digest:
          type: string
          description: The payload is content-addressed; the event carries only its digest.
        created_at_ms:
          type: integer
          format: int64
          description: Unix milliseconds - not an RFC 3339 timestamp, unlike every other created_at.
      required: [seq, id, aggregate_type, aggregate_id, actor, event_type, payload_digest, created_at_ms]

    Understanding:
      type: object
      title: Understanding
      description: |
        The Current Understanding projection (`projection.Understanding`) - what the system believes,
        assembled from relational state with provenance retained. `summary` and `needs_judgment` are
        rendered deterministically from the entities below them, never narrated by a model.
      properties:
        title: { type: string }
        description: { type: string }
        status: { $ref: "#/components/schemas/InitiativeStatus" }
        failure_reason: { type: string }
        summary: { type: string }
        needs_judgment:
          type: array
          items: { type: string }
          description: The items waiting on a human, phrased for display.
        assertions:
          type: array
          items: { $ref: "#/components/schemas/UnderstandingItem" }
        requirements:
          type: array
          items: { $ref: "#/components/schemas/RequirementView" }
          description: Requirements with status `removed` are omitted.
        decisions:
          type: array
          items: { $ref: "#/components/schemas/DecisionView" }
        questions:
          type: array
          items: { $ref: "#/components/schemas/QuestionView" }
      required: [title, description, status, summary, needs_judgment, assertions, requirements, decisions, questions]

    UnderstandingItem:
      type: object
      title: UnderstandingItem
      properties:
        id: { type: string }
        type:
          type: string
          enum: [fact, assumption, hypothesis]
        status:
          type: string
          enum: [candidate, accepted, disputed, retracted, superseded]
        statement: { type: string }
        confidence: { $ref: "#/components/schemas/Confidence" }
        source: { type: string }
        provenance:
          type: array
          items: { $ref: "#/components/schemas/ProvenanceRef" }
        produced_by_run: { type: string }
      required: [id, type, status, statement, confidence, source, provenance, produced_by_run]

    RequirementView:
      type: object
      title: RequirementView
      properties:
        id: { type: string }
        code: { type: string }
        statement: { type: string }
        priority: { $ref: "#/components/schemas/RequirementPriority" }
        status: { $ref: "#/components/schemas/RequirementStatus" }
        acceptance_criteria:
          type: array
          items: { $ref: "#/components/schemas/AcceptanceCriterion" }
      required: [id, code, statement, priority, status, acceptance_criteria]

    DecisionView:
      type: object
      title: DecisionView
      properties:
        id: { type: string }
        code: { type: string }
        question: { type: string }
        recommendation: { type: string }
        options:
          type: array
          items: { type: string }
        resolution: { type: string }
        status:
          type: string
          enum: [open, decided, superseded]
        has_dissent: { type: boolean }
        dissents:
          type: array
          items: { $ref: "#/components/schemas/DissentView" }
        synthesis:
          type: string
          description: Present only when there was dissent; the convergence that reconciled it.
      required: [id, code, question, recommendation, options, status, has_dissent, dissents]

    DissentView:
      type: object
      title: DissentView
      properties:
        proponent_role: { type: string }
        position: { type: string }
      required: [proponent_role, position]

    QuestionView:
      type: object
      title: QuestionView
      properties:
        id: { type: string }
        question: { type: string }
        status:
          type: string
          enum: [open, resolved]
      required: [id, question, status]

    Guidance:
      type: object
      title: Guidance
      description: |
        The Recommended Next Move projection (`projection.Guidance`, formerly `NextMove`), served by
        `/guidance` - display copy, not a command. `/next` is the machine-executable counterpart.
      properties:
        action:
          type: string
          description: An English sentence, e.g. "Resolve open decisions".
        why:
          type: string
          description: The rationale, e.g. "2 decision(s) need your judgment before proceeding."
        affected:
          type: array
          items: { type: string }
          description: The areas the move touches, e.g. ["Product Definition"].
        next_task:
          allOf: [{ $ref: "#/components/schemas/NextTaskRef" }]
          description: |
            The task `Execute` would run next, reusing the workflow's own task-readiness check.
            Omitted (never `null`) when there is no ready task - every other field on this
            endpoint's contract is "omit rather than emit null", and this is that same rule for a
            single optional object.
        run_blocked_reason:
          type: string
          description: |
            Empty (and so omitted) when `Execute` could start right now for this initiative,
            otherwise a user-facing sentence naming the fix: another change set is still open
            (e.g. "CHG-1 is still review required; apply or reject it before running the next
            task"), an operation is already running ("An operation is already running"), the
            plan is not approved yet ("The plan is not approved yet"), the initiative failed or is
            complete, or the executor is not ready (the same `problem` sentence `GET /executors`'
            `status` reports, e.g. "ANTHROPIC_API_KEY is not set in the daemon's environment or the
            project's .env; set it, then restart the daemon with idea daemon stop (the next command starts it again)"). A coding-agent image that is not
            pulled yet does not block: the first run pulls it.
        partial_work:
          type: object
          description: |
            What a stopped run left for the next run of its task to continue from; omitted when
            nothing is kept. The next execute of the same task carries these files into its work
            root (only where the workspace has not changed since) and lists them in a
            `carried_over` finding. `DELETE .../partial-work` discards them.
          properties:
            task_id: { type: string }
            task_human_id: { type: string }
            files: { type: integer }
            note:
              type: string
              description: Why nothing was kept, when the stopped run's files looked like they held a secret.
          required: [task_id, files]
        stale_items:
          type: array
          items: { $ref: "#/components/schemas/StaleItemRef" }
          description: |
            The requirements, tasks and change sets marked stale by a decision that was reopened or
            re-resolved after they were built on it (review A4 #5). Omitted when nothing is stale.
            When present, `why` also carries a sentence naming the count and the decision code, and
            the recommended path (`idea revise-plan`, or acknowledge each item via
            `POST .../stale/{staleId}/ack`).
      required: [action, why, affected]

    StaleItemRef:
      type: object
      title: StaleItemRef
      description: One item marked stale on the Recommended Next Move projection (review A4 #5).
      properties:
        stale_id:
          type: string
          description: The stale mark's own id -- what `POST …/stale/{staleId}/ack` takes. Distinct from `id`.
        type:
          type: string
          description: "The graph node's type: `requirement`, `task` or `change_set`."
        id:
          type: string
          description: The graph node's id (the requirement/task/change set), not the stale mark's id.
        label:
          type: string
          description: The item's human code (`REQ-3`, `TASK-2`, `CHG-1`), when it could be resolved.
        reason:
          type: string
          description: Why it is stale, e.g. `"DEC-9 changed"`.
      required: [stale_id, type, id, reason]

    NextTaskRef:
      type: object
      title: NextTaskRef
      description: The task `Execute` would run next, named without exposing the full Task.
      properties:
        id: { type: string }
        human_id:
          type: string
          description: The task's human-readable code, e.g. `TASK-2`.
        title: { type: string }
      required: [id, human_id, title]

    Changed:
      type: object
      title: Changed
      properties:
        groups:
          type: array
          items: { $ref: "#/components/schemas/ChangeGroup" }
        through:
          type: integer
          format: int64
          description: The highest event sequence covered. Echo this to `/seen`.
      required: [groups, through]

    ChangeGroup:
      type: object
      title: ChangeGroup
      properties:
        category: { type: string }
        items:
          type: array
          items: { type: string }
      required: [category, items]

    TimelineRef:
      type: object
      title: TimelineRef
      description: Points a TimelineEntry at the entity it is about.
      properties:
        type: { type: string, description: "e.g. `change_set`, `decision`, `operation`, `initiative`." }
        id: { type: string }
      required: [type, id]

    TimelineEntry:
      type: object
      title: TimelineEntry
      description: |
        One human-language line of an initiative's timeline (C1, wave 3 contract).

        M3, wave 3 review fix: `change_set_denied` is reserved for a genuine system block -- a
        finding on that change set carries a machine-readable deny code (a secret, PII, a path
        escape, host exec, a blob mismatch, an unresolved blocking review finding). A plain check
        failure (build/tests) and the restart-reconcile sweep (an interrupted run recovering, with
        no findings of its own) both read `change_set_rejected` instead, same as a human
        reviewer's own reject verdict -- none of those three is a system-level deny, whatever actor
        recorded the transition.
      properties:
        at: { type: string, format: date-time }
        kind:
          type: string
          enum:
            - change_set_applied
            - change_set_rejected
            - change_set_denied
            - change_set_reverted
            - run_failed
            - run_stopped
            - decision_changed
            - stale
            - phase_completed
        title: { type: string }
        detail: { type: string }
        ref: { $ref: "#/components/schemas/TimelineRef" }
      required: [at, kind, title, ref]

    PhaseCost:
      type: object
      title: PhaseCost
      description: One workflow phase's model-call spend and time (C3, wave 3 contract).
      properties:
        phase: { type: string, description: "The workflow stage key, e.g. `product_definition`, `review`." }
        usd: { type: number }
        seconds: { type: number }
        calls: { type: integer }
      required: [phase, usd, seconds, calls]

    AgentCost:
      type: object
      title: AgentCost
      description: The coding-agent run summary (C3, wave 3 contract).
      properties:
        runs: { type: integer }
        seconds: { type: number }
        usd:
          type: [number, "null"]
          description: |
            Null ("agent spend not measured") unless every counted run's cost could be parsed
            from the agent's own output.
        note:
          type: string
          description: Set alongside a null `usd`, e.g. "agent spend not measured".
      required: [runs, seconds, usd]

    InitiativeCosts:
      type: object
      title: InitiativeCosts
      description: The `GET .../costs` response (C3, wave 3 contract).
      properties:
        total_usd: { type: number }
        by_phase:
          type: array
          items: { $ref: "#/components/schemas/PhaseCost" }
          description: >-
            Ordered by the pipeline's own step order (framing, research, product_definition,
            review, ...), not alphabetically by stage key; a stage the pipeline order does not
            name sorts after every known one (review Low fix).
        agent: { $ref: "#/components/schemas/AgentCost" }
      required: [total_usd, by_phase, agent]

    QueueItem:
      type: object
      title: QueueItem
      description: One cross-initiative "needs you" row (D-b, wave 3 contract).
      properties:
        initiative_id: { type: string }
        short_title: { type: string }
        kind:
          type: string
          description: "e.g. `decision`, `review`, `conflict`, `denial`, `stale`, `verify`."
        label: { type: string }
        rank:
          type: integer
          format: int32
          description: >-
            A small 1..N ordinal position in the returned (already-sorted) list -- 1 is the
            single most urgent item, N is the list's length (H6, wave 3 review fix: never the
            internal tier/age sort key, which routinely exceeded a double's safe-integer range
            and rendered as a garbled number).
        href: { type: string, description: "A client-side route, e.g. `#/i/<id>/build`." }
      required: [initiative_id, short_title, kind, label, rank, href]

    TraceItem:
      type: object
      title: TraceItem
      description: One product-graph edge, with labels resolved for display.
      properties:
        edge_type: { type: string }
        from_type: { type: string }
        from_id: { type: string }
        from_label: { type: string }
        to_type: { type: string }
        to_id: { type: string }
        to_label: { type: string }
      required: [edge_type, from_type, from_id, to_type, to_id]

    ImpactItem:
      title: ImpactItem
      description: |
        A `TraceItem` plus a staleness classification for the dependent node: `"obsolete"`
        (supersedes/invalidates edges), `"revalidate"` (every other edge type), or `"stale"` (review
        A4 #5: an active stale mark on this exact node, which always wins over the edge-type
        classification).
      allOf:
        - $ref: "#/components/schemas/TraceItem"
        - type: object
          properties:
            staleness: { type: string }
          required: [staleness]

    SemanticDiff:
      type: object
      title: SemanticDiff
      properties:
        requirements:
          type: object
          properties:
            added:
              type: array
              items: { $ref: "#/components/schemas/DiffRequirement" }
            removed:
              type: array
              items: { $ref: "#/components/schemas/DiffRequirement" }
          required: [added, removed]
        decisions:
          type: object
          properties:
            open:
              type: array
              items: { $ref: "#/components/schemas/DiffDecision" }
            decided:
              type: array
              items: { $ref: "#/components/schemas/DiffDecision" }
            superseded:
              type: array
              items: { $ref: "#/components/schemas/DiffDecision" }
          required: [open, decided, superseded]
      required: [requirements, decisions]

    DiffRequirement:
      type: object
      title: DiffRequirement
      properties:
        code: { type: string }
        statement: { type: string }
        priority: { $ref: "#/components/schemas/RequirementPriority" }
      required: [code, statement, priority]

    DiffDecision:
      type: object
      title: DiffDecision
      properties:
        code: { type: string }
        question: { type: string }
        resolution: { type: string }
      required: [code, question]

    Coverage:
      type: object
      title: Coverage
      description: Verification coverage for one requirement.
      properties:
        code: { type: string }
        pass:
          type: integer
          description: Acceptance criteria with passing evidence.
        total:
          type: integer
          description: Acceptance criteria in total.
        needs_manual:
          type: integer
          description: |
            Criteria still waiting on a human. Zero for a waived requirement — waived is out of
            scope, not pending — so read this alongside `status` rather than on its own.
        status: { $ref: "#/components/schemas/RequirementStatus" }
      required: [code, pass, total, needs_manual, status]

    RiskTier:
      type: string
      title: RiskTier
      enum: [low, medium, high, critical]

    RiskSignal:
      type: object
      title: RiskSignal
      properties:
        name: { type: string }
        detected: { type: boolean }
        detail: { type: string }
      required: [name, detected]

    RiskProfile:
      type: object
      title: RiskProfile
      description: |
        A coarse risk tier and the signals behind it (`domain.RiskProfile`). Deterministic, with no
        numeric score - the tier is the floor implied by the detected signals.
      properties:
        id: { type: string }
        initiative_id: { type: string }
        tier: { $ref: "#/components/schemas/RiskTier" }
        signals:
          type: array
          items: { $ref: "#/components/schemas/RiskSignal" }
        reason:
          type: array
          items: { type: string }
        created_at: { type: string, format: date-time }
      required: [id, initiative_id, tier, signals, created_at]

    ProviderConfig:
      type: object
      title: ProviderConfig
      description: |
        One provider entry as written to `harness.yaml`. Inline key values are rejected — the body
        is closed, so a field this schema does not declare (`api_key`, say) answers 400 naming it
        rather than being silently dropped. Use `api_key_env`.

        An entry that resolves to no endpoint is refused: a built-in preset may be configured by
        name alone (`{"openai": {}}` inherits the preset's type, base URL and key variable), but any
        other name needs a `base_url`.
      properties:
        type:
          type: string
          description: Provider type, e.g. `openai`, `anthropic`, `openai_compatible`.
        api_key_env:
          type: string
          description: The **name** of the environment variable holding the key - never the key.
        base_url: { type: string }
        models:
          type: array
          items: { type: string }

    ProviderSummary:
      type: object
      title: ProviderSummary
      description: The API and UI view of one provider (`providerSummary`).
      properties:
        name: { type: string }
        label: { type: string }
        type: { type: string }
        base_url:
          type: string
          description: |
            The endpoint requests will actually reach. When `problem` is set, a preset falls back to
            its built-in endpoint and a custom name resolves nowhere, so this is empty rather than
            the refused value.
        key_env:
          type: string
          description: The environment variable name the key is read from.
        ready:
          type: boolean
          description: The key is present (or none is needed) and the entry has no problem.
        key_set:
          type: boolean
          description: |
            Whether the **daemon** can see this provider's key, in its own environment or the
            project `.env` it loaded. Narrower than `ready`, which also folds in whether the
            entry was refused — a caller that must tell "no key" from "this entry was rejected"
            cannot use `ready`, and the two have different fixes.
        configured:
          type: boolean
          description: False for an unconfigured preset that is offered so the UI can add it.
        is_default: { type: boolean }
        models:
          type: array
          items: { type: string }
          description: Live from the provider when ready, else the bundled catalog; configured models are merged in.
        problem:
          type: string
          description: Why a configured entry is not being used. Empty for a healthy one.
      required: [name, label, type, base_url, key_env, ready, configured, is_default, models]

    ProvidersView:
      type: object
      title: ProvidersView
      description: The `GET /providers` response (`providersView`).
      properties:
        default_model:
          type: string
          description: "`provider/model`."
        models:
          type: object
          additionalProperties: { type: string }
          description: Per-role model overrides; omitted when empty.
        git_commit:
          type: boolean
          description: Whether applied change sets are committed to git.
        git_allow_default_branch:
          type: boolean
          description: harness.yaml `git.allow_default_branch` (review C4, adopted #2; wave 3 contract).
        git_branch_per_initiative:
          type: boolean
          description: harness.yaml `git.branch_per_initiative`.
        review_rigor:
          type: string
          enum: [auto, quick, standard, thorough]
          description: harness.yaml `review.rigor`; `auto` when unset.
        demo:
          type: boolean
          description: True when no real provider is configured or reachable, so output will be synthetic.
        providers:
          type: array
          items: { $ref: "#/components/schemas/ProviderSummary" }
      required: [default_model, git_commit, git_allow_default_branch, git_branch_per_initiative, review_rigor, demo, providers]

    ExecutorKind:
      type: string
      title: ExecutorKind
      enum: [internal, container, omp, hermes]

    ExecutorView:
      type: object
      title: ExecutorView
      description: One available executor with its declared capabilities and the current configuration.
      properties:
        name: { $ref: "#/components/schemas/ExecutorKind" }
        trust:
          type: string
          enum: [internal, local_external, remote_external]
        sandbox_mode:
          type: string
          enum: [container, local_restricted, host_approved]
        network: { type: boolean }
        capabilities:
          type: array
          items: { type: string }
        selected:
          type: boolean
          description: True for the executor the harness is configured to use.
        image:
          type: string
          description: The configured image - the same value on every entry, not per executor.
        model:
          type: string
          description: The configured executor model - likewise shared across entries.
        default_image:
          type: string
          description: The image this executor would use if none were configured.
        status: { $ref: "#/components/schemas/ExecutorStatus" }
      required: [name, trust, sandbox_mode, network, capabilities, selected, image, model, default_image, status]

    ExecutorStatus:
      type: object
      title: ExecutorStatus
      description: |
        Whether this executor is actually ready to run right now: image present, key set, and the
        one sentence to show instead of guessing when it is not. Only meaningful for `hermes`/`omp`
        (the coding agents run in a container against a keyed provider); `internal`/`container`
        always report ready, since neither pulls an agent image or forwards a provider key. Image
        presence is cached for about 30s so a poll never calls Docker more than once per interval.
      properties:
        image:
          type: string
          description: The image this executor would check (empty for internal/container).
        image_present:
          type: boolean
          description: Whether `image` is present locally. Always true for internal/container.
        image_state:
          type: string
          enum: [present, absent, unknown, docker_unavailable]
          description: |
            Why `image_present` is what it is. `unknown` means Docker answered slowly or with
            something unrecognised; it does not block a run. `docker_unavailable` does. Omitted for
            executors with no image.
        key_env:
          type: string
          description: The provider key's environment variable name, empty for a keyless provider.
        key_set:
          type: boolean
          description: |
            Whether the key is set in the daemon's own environment or the project's `.env`.
            Always true for internal/container.
        problem:
          type: string
          description: |
            Empty when ready, otherwise a user-facing sentence naming the fix, e.g. "Docker is not
            running or not installed; ..." or "ANTHROPIC_API_KEY is not set in the daemon's
            environment or the project's .env; set it, then restart the daemon with idea daemon stop (the next command starts it again)". A missing image is
            not a problem: `docker run` pulls it on first use; see `note`. Docker being unreachable is.
            Resolves the model exactly as execution does (`models.implementer`, then
            `executor.model`, then the implementer role's default).
        note:
          type: string
          description: |
            Information that does not block a run, e.g. "Image nousresearch/hermes-agent:v2026.5.16
            is not pulled yet; the first run downloads it, which can take several minutes. To pull
            it now: idea executors setup --kind hermes --model <model> --yes".
        last_smoke:
          type: object
          description: |
            The project's newest smoke test, for the selected executor only. Omitted when none has
            run, and when the last one tested a different kind, image or model than the current
            setup. A smoke still running is always reported.
          properties:
            status: { $ref: "#/components/schemas/OperationStatus" }
            finished_at: { type: string, format: date-time }
            error: { type: string }
          required: [status]
      required: [image, image_present, key_env, key_set]
