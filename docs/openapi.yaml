    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - $ref: "#/components/parameters/InitiativeId"
    get:
      tags: [graph]
      operationId: auditGraph
      summary: Product-graph traceability audit
      description: |
        **Moved in this release.** Was `GET /api/v1/projects/{projectId}/doctor?initiative_id=`.

        Audits the initiative's graph edges and returns the gaps - untraced tasks and objects,
        dependency cycles - as findings. An empty array means a clean graph. This is one of the
        checks behind `idea doctor`, not the whole command.
      responses:
        default: { $ref: "#/components/responses/RoutingError" }
        "200":
          description: The audit findings; empty when the graph is clean.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Finding" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/ConfigInvalid" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/v1/projects/{projectId}/decisions/{id}/resolve:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - $ref: "#/components/parameters/DecisionId"
    post:
      tags: [decisions]
      operationId: resolveDecision
      summary: Record the human's resolution
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                resolution: { type: string }
              required: [resolution]
      responses:
        default: { $ref: "#/components/responses/RoutingError" }
        "200":
          description: Resolved.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, const: decided }
                required: [status]
        "400":
          description: |
            `resolution is required`, or the decision exists and is not open (already resolved,
            superseded). A decision id matching nothing answers `404`; until the next release both cases
            shared this response and the same message.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/ConfigInvalid" }
        "500": { $ref: "#/components/responses/InternalError" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/projects/{projectId}/decisions/{id}/reopen:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - $ref: "#/components/parameters/DecisionId"
    post:
      tags: [decisions]
      operationId: reopenDecision
      summary: Undo a resolution
      description: |
        Takes no body. Also marks stale the LIVE requirements that cite this decision via a
        `derived_from` edge (review A4 #5) -- never one a later PRD revision superseded or removed
        (ICP re-run defect #4) -- their tasks, and the applied change sets for those tasks.
      responses:
        default: { $ref: "#/components/responses/RoutingError" }
        "200":
          description: Reopened.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, const: open }
                required: [status]
        "400":
          description: |
            The decision exists and was not resolved, so there is nothing to reopen. A decision id
            matching nothing answers `404`; until the next release both cases shared this response.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/ConfigInvalid" }
        "500": { $ref: "#/components/responses/InternalError" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/projects/{projectId}/decisions/{id}/discussion:
    parameters:
