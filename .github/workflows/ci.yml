name: ci

on:
  push:
  pull_request:
  workflow_dispatch: # manual trigger (used for the opt-in agent tier)

# Least privilege by default. Every job here is read-only except `release`,
# which declares `contents: write` for itself in order to create the GitHub
# release, plus `id-token: write` and `attestations: write` to sign and attest
# it. Job-level `permissions` REPLACES this default rather than merging
# with it, and any scope a job block omits is set to `none` -- so the agent tier,
# which runs a real coding agent with network egress, declares `contents: read`
# explicitly and cannot inherit the release job's write token.
permissions:
  contents: read

jobs:
  # The compile gate (DX audit, BROKEN_CANONICAL_INSTALL): a clean checkout must
  # build, vet and test with no Node toolchain present. Runs in a Go container
  # rather than on the hosted runner, whose image ships Node on PATH regardless
  # of setup-node.
  compile-no-node:
    name: Go (no Node toolchain)
    runs-on: ubuntu-latest
    container: golang:1.25-bookworm
    steps:
      # fetch-depth: 0 is load-bearing, not hygiene. version-check compares every
      # released CHANGELOG section against its content at the newest tag, and the
      # default depth-1 checkout has no tags -- the rule would skip, in the one
      # place it is supposed to run. Skill 2.9.4's UNVERIFIABLE_CI_PARITY makes a
      # documented check that cannot predict CI its own P1 gate.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Assert no Node toolchain
        run: |
          ! command -v node || { echo "node is on PATH; this job must run without it"; exit 1; }
          ! command -v pnpm || { echo "pnpm is on PATH; this job must run without it"; exit 1; }

      # This job runs inside a container, so the checkout is owned by a
      # different uid than the one git runs as. Without this, git refuses the
      # repository as dubiously owned, exits 128, and every `go build` fails
      # with "error obtaining VCS status" -- Go stamps VCS info into main
      # packages by default, and `idea version` depends on that stamp for
      # binaries built by `go install`. Marking the checkout safe keeps the
      # stamping rather than disabling it with -buildvcs=false.
      - name: Trust the checkout inside the container
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Build, vet, test from a clean checkout
        run: |
          go build ./...
          go vet ./...
          go test ./...

      - name: Committed embed placeholder is intact
        run: make check-embed

      # The gate this job exists for (BROKEN_CANONICAL_INSTALL): the binary a
      # clean checkout produces must actually run and serve the UI route, not
      # merely compile.
      - name: Installed binary serves the UI
        run: |
          go install ./cmd/idea
          IDEA_HARNESS_STATE="$(mktemp -d)"
          export IDEA_HARNESS_STATE
          export IDEA_HARNESS_ADDR=127.0.0.1:18787
          "$(go env GOPATH)/bin/idea" daemon >"$IDEA_HARNESS_STATE/daemon.log" 2>&1 &
          for _ in $(seq 1 50); do
            curl -fsS -o /dev/null "http://$IDEA_HARNESS_ADDR/" && break
            sleep 0.2
          done
          code=$(curl -s -o /tmp/index.html -w '%{http_code}' "http://$IDEA_HARNESS_ADDR/")
          test "$code" = "200" || { echo "GET / returned $code"; cat "$IDEA_HARNESS_STATE/daemon.log"; exit 1; }
          grep -q 'id="root"' /tmp/index.html || { echo "served page has no app root"; exit 1; }
          grep -q 'name="idea-token"' /tmp/index.html || { echo "token was not injected"; exit 1; }

      # Cheap: the generator is a `go run` against packages this job has already
      # compiled, and it needs no daemon, no network and no Node.
      - name: docs/cli.md matches the CLI command table
        run: make docs-check

      # Same shape, same cost, and it has already caught three endpoints added
      # by other work in progress: a route registered in routes.go that
      # docs/openapi.yaml does not document, or a documented operation no route
      # serves. Until now it only ran when someone remembered to type it.
      - name: docs/openapi.yaml matches the daemon's routes
        run: make api-check

      # The second axis. api-check compares routes to the machine spec, and the
      # spec was right -- all 81 operations -- while docs/api.md described 71 and
      # README called it "every endpoint". Nothing compared routes to the human
      # document, so ten endpoints went missing with both guards green.
      - name: docs/api.md has a row for every route
        run: make api-docs-check

      # The third axis. The first two compare code to machine artifacts; this
      # compares code to the prose a reader copies. `idea trace task T-3` sat on
      # the README's front page through three audits -- scripts/smoke.sh had said
      # TASK-1 all along and nothing compared the two.
      - name: documented commands name real verbs and resolvable references
        run: make docs-lint

      # The fourth axis, and the one aimed at the class that keeps producing P0s:
      # a security property stated in several documents, corrected in some. Audit
      # 3 fixed security.md and left configuration.md promising redaction that
      # does not happen; audit 4 found one claim in six sentences across four
      # files. This proves each is stated once — not that it is true.
      - name: security claims are single-sourced
        run: make claims-check

      # The fifth axis: the defect ledgers themselves. Every audit round writes
      # one, and the failure mode is that nobody re-checks it -- audit 3's had
      # all 27 rows marked open while 21 had already been fixed by earlier
      # rounds, so the file read as a backlog and was ignored. Each row now
      # carries a predicate that is true exactly when its defect is present, and
      # this fails in both directions: a row marked open whose defect is gone,
      # and a row marked fixed whose defect returned.
      - name: defect ledgers agree with the tree
        run: make ledger-check

      # The sixth axis: controlled vocabularies. The three route-level guards
      # compare paths and field *names*; none compares a value set. That is how
      # RequirementStatus shipped listing four of the six statuses the domain
      # emits, and how the review verdict enum came to document the CLI's words
      # (`approve`) rather than the API's (`approved`) -- a client generated
      # from the spec could not approve a change set at all.
      - name: spec enums match the domain constants
        run: make enum-check

      # The seventh axis: the spec's own version. It said 0.1.0 from the file's
      # creation through three tags, while gaining response codes, schemas,
      # properties and an enum -- because the only thing asking for a bump was a
      # sentence in docs/api-reference-hosting.md. This half needs no tag: it
      # refuses a spec describing a release CHANGELOG.md has already superseded,
      # and would have fired the first push after v0.2.0 shipped.
      - name: the spec's version is not older than the last release
        run: make version-check

  # macOS is a supported platform and nothing in this repo branches on
  # runtime.GOOS, so the darwin/linux differences that matter are filesystem
  # semantics — case-insensitivity, /var -> /private/var symlink resolution,
  # Lstat behavior. That is precisely where the path guard (internal/security),
  # the change-set deny (internal/fsdiff) and the snapshot walk live. A
  # case-sensitivity bypass in the control-plane deny reached a release before
  # this job existed.
  # Both architectures, because the four release binaries do not share a
  # persistence layer. Nothing first-party branches on GOARCH -- one //go:build
  # unix file, no runtime.GOARCH anywhere -- but modernc.org/sqlite vendors a
  # machine-translated SQLite per GOOS/GOARCH and modernc.org/libc carries 194
  # arch-suffixed files. Measured on this tree: darwin/arm64 compiles 210 Go
  # files from those two modules, darwin/amd64 206. "No arch-specific source" is
  # true of this repository and false of the thing shipped, and the untested
  # part was the storage layer.
  #
  # macos-15-intel is a native x86-64 runner on the standard (free-minutes) pool,
  # not a billed -large runner, so this costs a job rather than emulation.
  #
  # It has a sunset: GitHub has said macos-15-intel is the last x86_64 Actions
  # image and it goes away in August 2027, after which hosted x86_64 macOS does
  # not exist. When that lands, either drop darwin/amd64 from the release
  # matrix in .goreleaser.yaml or accept that it ships untested and say so in
  # README's build-vs-test table -- do not let the job quietly disappear and
  # leave the table claiming coverage that stopped.
  macos:
    name: Go (macOS ${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-latest
          - arch: amd64
            runner: macos-15-intel
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true

      - name: Build and vet
        run: |
          go build ./...
          go vet ./...

      # -json, because `go test` prints nothing for a skipped test: a job that
      # shows only normal output cannot distinguish "ran everything" from
      # "silently skipped the container-backed tests", which is exactly the
      # claim this platform's green check would otherwise be making.
      # `|| status=$?` rather than continue-on-error: the step must reach the
      # summary below, but the status has to survive to it. No event in the
      # stream can describe an output file that was truncated or never written,
      # and without this the summary answers "All tests passed (0 package(s)
      # with tests)" for an empty file, a non-JSON file, and a stream cut
      # mid-run -- on a job that now gates a release.
      - name: Test
        run: |
          status=0
          go test -json ./... > "$RUNNER_TEMP/gotest.json" || status=$?
          echo "$status" > "$RUNNER_TEMP/gotest.status"

      - name: Results — failures and what skipped here
        run: |
          python3 scripts/ci-test-summary.py \
            "$RUNNER_TEMP/gotest.json" "$(cat "$RUNNER_TEMP/gotest.status")"

      - name: Smoke (end-to-end, deterministic demo — no secrets)
        env:
          # smoke.sh defaults these into the repo so sandboxed runs never write
          # to a home dir; point them at the runner's cache instead, or the
          # module graph is re-downloaded on a runner billed at 10x Linux.
          GOPATH: ${{ github.workspace }}/.gocache/gopath
          GOCACHE: ${{ github.workspace }}/.gocache/build
          GOMODCACHE: ${{ github.workspace }}/.gocache/gopath/pkg/mod
        run: bash scripts/smoke.sh

  backend:
    name: Go (vet + test + smoke)
    runs-on: ubuntu-latest # Docker is preinstalled, so the sandbox test RUNS
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true

      - uses: pnpm/action-setup@v5
        with:
          version: "10"

      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Build web UI and embed into the binary
        run: make embed-web

      # `make build` and not just `go build ./...`: the make target is what
      # CONTRIBUTING documents, and it differs -- it embeds the web UI, stamps
      # the version through ldflags, writes bin/idea and then restores the
      # placeholder. A green `go build ./...` does not predict it. Skill 2.9.4
      # makes a documented check with no CI step its own gate
      # (UNVERIFIABLE_CI_PARITY), and this was the only one left.
      - name: Build the binary the documented way
        run: make build

      - name: Vet
        run: go vet ./...

      - name: Test (unit + Docker sandbox + fsdiff + executors)
        run: go test ./...

      - name: Smoke (end-to-end, deterministic demo — no secrets)
        run: bash scripts/smoke.sh

  web:
    name: Web (build + unit tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v5
        with:
          version: "10"

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install
        working-directory: web
        run: pnpm install --frozen-lockfile

      - name: Build
        working-directory: web
        run: pnpm build

      - name: Unit test
        working-directory: web
        run: pnpm test

  # The browser suite (web/e2e). Unit and component tests check pieces; this
  # drives the built binary's real UI through the whole loop -- idea to verify
  # -- and runs axe on every page, failing on serious/critical violations. A UI
  # review found defects every other job here passed, all of them visible only
  # in a browser against a running daemon. Hermetic: the demo provider, an
  # isolated state dir and port, no provider secrets.
  e2e:
    name: Web (browser e2e + accessibility)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true

      - uses: pnpm/action-setup@v5
        with:
          version: "10"

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install
        working-directory: web
        run: pnpm install --frozen-lockfile

      # Keyed on the lockfile, which pins the Playwright version and so the
      # browser build it downloads.
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('web/pnpm-lock.yaml') }}

      - name: Install Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        working-directory: web
        run: pnpm exec playwright install --with-deps chromium

      # The cache holds the browser, not the system libraries it links.
      - name: Install Chromium's system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        working-directory: web
        run: pnpm exec playwright install-deps chromium

      - name: Browser suite
        run: make e2e

      - name: Keep the report and traces of a failed run
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-report
          path: |
            web/e2e/.report
            web/e2e/.results
            web/e2e/.work/state/daemon.log
          # upload-artifact v4 skips dot-directories unless told otherwise,
          # and every path above is one: without this a failed run kept only
          # the daemon log, never the trace or screenshot.
          include-hidden-files: true
          retention-days: 7

  # The release. It lives HERE, and not in a workflow of its own, because
  # `needs:` resolves job ids within a single workflow file and cannot reference
  # a job in another one. DX audit 7 found .github/workflows/release.yml gating a
  # tag on `go vet` and `go test` on one OS -- none of the eight guards, no
  # smoke, no macOS, no web tests -- and the report's own suggested fix ("two
  # lines: needs: [...]") would not have worked for exactly that reason. The
  # jobs above already ran on every tag push, since `on: push:` is unfiltered;
  # they simply did not gate. Now they do.
  #
  # Copying the guard steps into a separate release workflow was the alternative
  # and was rejected: a ninth guard added above would not reach the copy, and
  # nothing would say so. That divergence IS the finding. `needs` cannot drift.
  #
  # internal/ciguard asserts that every job in this file either gates the
  # release or is listed as an explicit exemption, so the next job added has to
  # make that choice rather than have it made by omission.
  release:
    name: Publish release binaries
    needs: [compile-no-node, macos, backend, web, e2e, agent-contract]
    # `github.event_name == 'push'` is load-bearing, not decoration: this
    # workflow accepts workflow_dispatch, a dispatch can select a tag ref, and a
    # ref test alone would open a publishing path release.yml never had.
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release and upload archives
      # Keyless cosign signing of checksums.txt and the provenance attestation
      # below both authenticate as this workflow through a GitHub OIDC token.
      # Scoped to this job only: the agent tier must never be able to mint one.
      id-token: write
      attestations: write # store the build-provenance attestation
    # No cancel-in-progress, deliberately. Nothing races today, but this
    # workflow now runs on every push, which makes a workflow-level
    # `concurrency: { cancel-in-progress: true }` a tempting future addition --
    # and it would cancel a running release. Do not add one.
    concurrency:
      group: release-${{ github.ref }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # goreleaser derives Tag, FullCommit and Version from history
          # goreleaser is handed GITHUB_TOKEN explicitly below, so a persisted
          # credential buys nothing and only widens the blast radius.
          persist-credentials: false

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true

      # The committed internal/web/dist/index.html is a placeholder, so the real
      # UI has to be built before the binaries are.
      - uses: pnpm/action-setup@v5
        with:
          version: "10"

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      # Before goreleaser, so a mismatch costs a deleted tag rather than a
      # published release with a spec claiming a different version. docs/
      # openapi.yaml's info.version sat at 0.1.0 across three tags because the
      # only thing asking for a bump was a sentence in a hosting document.
      - name: The spec's version matches the tag
        # $GITHUB_REF_NAME, not ${{ github.ref_name }}: git accepts `v0.4.0$(id)`
        # and `v0.4.0;id` as tag names, and this job holds contents: write. The
        # variable is set automatically; interpolation would splice the tag into
        # the shell.
        run: make version-check VERSION="$GITHUB_REF_NAME"

      # Deliberately NOT `make embed-web` here: it overwrites the tracked
      # internal/web/dist/index.html placeholder, and goreleaser refuses to run
      # on a dirty tree, so a real tag push would abort at the release step.
      # That was caught once as a pre-merge P0 (see git show 04442b7) and this
      # job now sits directly below `backend`, whose second step is exactly that
      # command -- so the warning stays with the job it warns about.
      #
      # `make check-embed` is not needed here either: goreleaser's before-hook
      # dirties the tree only AFTER goreleaser's own git validation, and nothing
      # runs afterward. compile-no-node checks the placeholder, and this job
      # needs it.
      # goreleaser shells out to both: cosign for the `signs` block, syft for
      # the `sboms` block. Neither is on the hosted runner.
      - uses: sigstore/cosign-installer@v3

      - uses: anchore/sbom-action/download-syft@v0

      - uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Optional. Absent, .goreleaser.yaml skips the cask push rather than
          # failing the release (see homebrew_casks.skip_upload there).
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}

      # Build provenance for every archive, stored by GitHub and checkable with
      # `gh attestation verify` (RELEASING.md). After goreleaser because it
      # attests the files goreleaser wrote to dist/.
      #
      # Public repositories only. On GitHub Free, Pro and Team plans artifact
      # attestations are unavailable for private repositories and the action
      # fails -- which, this being the last step, would mark a release that
      # did publish as failed. The cosign signature above does not have that
      # limit, so a private-repository release is still signed.
      - name: Attest build provenance
        if: github.event.repository.visibility == 'public'
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: dist/*.tar.gz

  # The coding-agent path shipped broken twice over and nothing noticed: the
  # Hermes argv used a flag the image does not have, and the hardened container
  # could not boot the image at all. Neither needs an API key to detect, and the
  # only job that exercised the path is the opt-in tier below, which had never
  # run. This one runs the REAL executor against the pinned image with a
  # refused endpoint and asserts Hermes accepted the query.
  #
  # Push-only rather than every PR because the image is 5.4 GB. It gates the
  # release, so a tag cannot ship an agent path that does not start.
  agent-contract:
    name: Agent contract (pinned Hermes image, no key)
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true

      # `pinned` makes the test resolve and pull executor.DefaultAgentImage
      # itself, so the tag lives in one place and cannot drift from what
      # `idea executors setup` downloads.
      - name: Run the executor against the pinned image
        run: go test ./internal/executor/ -run TestAgentContractAgainstThePinnedImage -v -timeout 15m
        env:
          IDEA_AGENT_CONTRACT_IMAGE: pinned

  agent:
    name: Agent integration (opt-in — real Hermes + model)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      HERMES_IMAGE: ${{ vars.HERMES_IMAGE }}
      AGENT_MODEL: ${{ vars.AGENT_MODEL }}
    steps:
      - uses: actions/checkout@v5
        with:
          # This job applies a coding agent's output into the workspace; it must
          # not carry a credential that could push it anywhere.
          persist-credentials: false

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true

      # Measure the real path so docs/quickstart.md can cite a number that was
      # observed rather than estimated. Only the elapsed seconds are printed:
      # the daemon log and the model's own output can carry material outside the
      # redactor's catalog, so nothing from the run itself is echoed here.
      - name: Run a real Hermes task and assert a real diff
        run: |
          start=$SECONDS
          bash scripts/agent-smoke.sh
          elapsed=$(( SECONDS - start ))
          # agent-smoke.sh exits 0 without running anything when the opt-in
          # variables are unset; a number from that run would not be the real
          # path, so it is reported as skipped instead.
          if [ -n "${HERMES_IMAGE:-}" ] && [ -n "${AGENT_MODEL:-}" ]; then
            echo "agent_tier_wall_clock_seconds=$elapsed"
            echo "agent_tier_wall_clock_seconds=$elapsed" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "agent_tier_wall_clock_seconds=skipped"
          fi
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: Run executors setup --smoke against the pinned image
        run: bash scripts/executor-setup-smoke.sh
        env:
          AGENT_MODEL: ${{ vars.AGENT_MODEL }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
