# Release build for idea-harness.
#
# Binaries are built in CI, never on a maintainer's laptop: a local `go build`
# embeds the builder's home directory in the binary (readable with
# `go version -m`), which -trimpath removes.
#
# The web UI must be built and embedded BEFORE goreleaser runs — the committed
# internal/web/dist/index.html is a placeholder, so a release built without the
# `make embed-web` hook below would ship a binary whose UI says "not built".
version: 2

project_name: idea-harness

before:
  hooks:
    - make embed-web

builds:
  - id: idea
    main: ./cmd/idea
    binary: idea
    env:
      - CGO_ENABLED=0 # modernc.org/sqlite is pure Go, so this stays portable
    goos: [darwin, linux]
    goarch: [amd64, arm64]
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X github.com/devarispbrown/idea-harness/internal/buildinfo.version={{ .Tag }}
      - -X github.com/devarispbrown/idea-harness/internal/buildinfo.commit={{ .FullCommit }}

archives:
  - id: idea
    formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - README.md
      - CHANGELOG.md

checksum:
  name_template: checksums.txt

# One SPDX SBOM per archive, generated by syft (installed by the release job in
# .github/workflows/ci.yml). Per archive rather than per binary because the
# archive is what a user downloads and what the checksum and attestation name.
sboms:
  - id: archive-sbom
    artifacts: archive
    documents:
      - "{{ .ArtifactName }}.sbom.json"

# Keyless cosign signing of checksums.txt (Sigstore, using the release job's
# GitHub OIDC identity -- `id-token: write` in ci.yml). Signing the checksum
# file covers every archive and SBOM it lists without a signature per file:
# verify the signature, then `shasum -a 256 -c checksums.txt`. RELEASING.md has
# the exact `cosign verify-blob` command.
#
# One Sigstore bundle (signature + certificate + transparency-log proof) rather
# than separate .sig/.pem files: it is what cosign v2.4+ recommends and the only
# form cosign v3 writes by default, and it verifies offline.
signs:
  - id: checksum-cosign
    cmd: cosign
    artifacts: checksum
    signature: "${artifact}.sigstore.json"
    args:
      - sign-blob
      - "--bundle=${signature}"
      - "${artifact}"
      - "--yes" # non-interactive: accept the transparency-log upload
    output: true

# Homebrew cask in devarispbrown/homebrew-tap, so that
#   brew install devarispbrown/tap/idea-harness
# installs the release binary. A cask (goreleaser v2's `homebrew_casks`) rather
# than the deprecated `brews` formula, which goreleaser is removing.
#
# The cask downloads the archive from this repository's release, so it only
# works for someone who can download that release: while the repository is
# private, nobody else can (RELEASING.md, "Homebrew").
homebrew_casks:
  - name: idea-harness
    ids: [idea]
    binaries: [idea]
    homepage: https://github.com/devarispbrown/idea-harness
    description: Local-first AI product-development control plane
    license: Apache-2.0
    repository:
      owner: devarispbrown
      name: homebrew-tap
      # A fine-grained PAT with contents:write on the tap only. GITHUB_TOKEN
      # cannot push to another repository.
      token: '{{ envOrDefault "HOMEBREW_TAP_GITHUB_TOKEN" "" }}'
    directory: Casks
    commit_author:
      name: idea-harness release
      email: noreply@github.com
    commit_msg_template: "idea-harness {{ .Tag }}"
    # Skipped outright when the tap token is absent, so a fork or a repository
    # without the secret still releases instead of failing at the push. With
    # the token, `auto` still skips prereleases (v1.0.0-rc1).
    skip_upload: '{{ if eq (envOrDefault "HOMEBREW_TAP_GITHUB_TOKEN" "") "" }}true{{ else }}auto{{ end }}'
    hooks:
      post:
        # The binary is not Apple-notarized, and Homebrew quarantines what a
        # cask installs, so Gatekeeper would refuse to run it. The checksum,
        # signature and attestation above are the integrity story instead.
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/idea"]
          end

changelog:
  # CHANGELOG.md is written by hand and is the source of truth; the release
  # notes point at it rather than restating a commit list.
  disable: true

release:
  draft: true # a human reads the notes before it is public
  footer: |
    See [CHANGELOG.md](https://github.com/devarispbrown/idea-harness/blob/main/CHANGELOG.md)
    for what changed.

    `checksums.txt` is signed with keyless cosign (`checksums.txt.sigstore.json`), each
    archive carries an SPDX SBOM (`*.sbom.json`), and each archive has a GitHub build-provenance
    attestation. [RELEASING.md](https://github.com/devarispbrown/idea-harness/blob/main/RELEASING.md#verifying-a-release)
    has the verification commands.

    Pre-1.0: the CLI surface, HTTP API and config schema may change in any release.
