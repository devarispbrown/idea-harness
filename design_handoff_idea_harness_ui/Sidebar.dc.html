<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<aside style="width:224px;flex:none;background:#fff;border-right:1px solid #e8e6e1;display:flex;flex-direction:column;padding:16px 12px;gap:4px;box-sizing:border-box">
  <div style="display:flex;align-items:center;gap:8px;padding:4px 8px 14px"><span style="width:22px;height:22px;border-radius:6px;background:#4f46e5;color:#fff;display:grid;place-items:center;font:700 11px ui-monospace,Menlo,monospace">ih</span><span style="font-weight:600;font-size:13px;letter-spacing:-.01em;color:#1c1917">idea-harness</span></div>
  <div style="border:1px solid #e8e6e1;border-radius:8px;padding:8px 10px;margin-bottom:10px;background:#faf9f7">
    <div style="font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:#a8a29e;font-weight:600">Initiative</div>
    <div style="font-size:12.5px;font-weight:600;color:#1c1917;margin-top:2px">Usage-based billing</div>
    <div style="font-size:11px;color:#78716c;margin-top:1px">my-product · #3 of 3 ▾</div>
  </div>
  <div style="display:flex;flex-direction:column;gap:2px">
    <sc-for list="{{ nav }}" as="n" hint-placeholder-count="7">
      <div style="display:flex;align-items:center;justify-content:space-between;gap:9px;padding:7px 10px;border-radius:7px;background:{{ n.bg }};color:{{ n.fg }};font-size:13px;font-weight:{{ n.wt }};cursor:pointer" style-hover="background:#f5f4f1"><span>{{ n.label }}</span><sc-if value="{{ n.count }}" hint-placeholder-val="{{ false }}"><span style="font:600 10.5px ui-monospace,Menlo,monospace;background:{{ n.cbg }};color:{{ n.cfg }};border-radius:999px;padding:1px 7px">{{ n.count }}</span></sc-if></div>
    </sc-for>
  </div>
  <div style="margin:14px 4px 0;border-top:1px solid #f0eeea;padding-top:12px">
    <div style="font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:#a8a29e;font-weight:600;padding:0 6px 8px">Phases</div>
    <sc-for list="{{ phases }}" as="ph" hint-placeholder-count="6">
      <div style="display:flex;gap:9px;padding:0 6px">
        <div style="display:flex;flex-direction:column;align-items:center;flex:none;width:14px">
          <span style="width:14px;height:14px;border-radius:50%;background:{{ ph.dotbg }};border:2px solid {{ ph.dotline }};color:{{ ph.dotfg }};display:grid;place-items:center;font-size:8px;font-weight:800;box-sizing:border-box">{{ ph.mark }}</span>
          <sc-if value="{{ ph.line }}" hint-placeholder-val="{{ true }}"><span style="flex:1;width:2px;background:#e8e6e1;margin:2px 0;min-height:10px"></span></sc-if>
        </div>
        <div style="padding-bottom:8px;min-width:0">
          <div style="font-size:12px;font-weight:600;color:{{ ph.fg }};line-height:14px">{{ ph.label }}</div>
          <sc-if value="{{ ph.note }}" hint-placeholder-val="{{ false }}"><div style="font-size:10.5px;color:{{ ph.notefg }};margin-top:1px">{{ ph.note }}</div></sc-if>
        </div>
      </div>
    </sc-for>
  </div>
  <div style="margin-top:auto;display:flex;flex-direction:column;gap:8px">
    <div style="border:1px solid #e8e6e1;border-radius:8px;padding:8px 10px;font-size:11px;color:#78716c;display:flex;align-items:center;gap:7px"><span style="width:7px;height:7px;border-radius:50%;background:#16a34a"></span><span style="font-family:ui-monospace,Menlo,monospace">anthropic/claude-4.5</span></div>
    <div style="display:flex;gap:6px;font-size:12px;color:{{ settingsFg }};padding:0 4px;font-weight:{{ settingsWt }}"><span>Settings</span><span style="margin-left:auto;border:1px solid #e8e6e1;border-radius:5px;padding:0 6px;font-size:10.5px;font-family:ui-monospace,Menlo,monospace;color:#78716c;font-weight:400">⌘K</span></div>
  </div>
</aside>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:&quot;224px&quot;,&quot;height&quot;:&quot;820px&quot;},&quot;active&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;overview&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;options&quot;:[&quot;overview&quot;,&quot;judgment&quot;,&quot;graph&quot;,&quot;tasks&quot;,&quot;changes&quot;,&quot;artifacts&quot;,&quot;activity&quot;,&quot;settings&quot;]}}">
class Component extends DCLogic {
  renderVals() {
    const active = this.props.active ?? "overview";
    const verify = (this.props.phase ?? "define") === "verify";
    const items = [
      { key: "overview", label: "Overview" },
      { key: "judgment", label: "Judgment", count: verify ? null : "6", warn: !verify },
      { key: "graph", label: "Graph", count: "21" },
      { key: "tasks", label: "Tasks", count: "5" },
      { key: "changes", label: "Changes", count: "2" },
      { key: "verify", label: "Verify", count: verify ? "2/4" : null, warn: verify },
      { key: "artifacts", label: "Artifacts", count: "3" },
      { key: "activity", label: "Activity" },
    ];
    const donePh = (label) => ({ label, mark: "✓", dotbg: "#4f46e5", dotline: "#4f46e5", dotfg: "#fff", fg: "#1c1917", note: false, line: true });
    const verifyPhases = [
      donePh("Explore"), donePh("Define"), donePh("Design"), donePh("Plan"), donePh("Build"),
      { label: "Verify", mark: "▶", dotbg: "#eef2ff", dotline: "#4f46e5", dotfg: "#4f46e5", fg: "#4f46e5", note: "2 of 4 verified", notefg: "#6d6a75", line: false },
    ];
    return {
      nav: items.map((n) => {
        const on = n.key === active;
        return {
          label: n.label,
          count: n.count || false,
          bg: on ? "#eef2ff" : "transparent",
          fg: on ? "#4f46e5" : "#57534e",
          wt: on ? 600 : 400,
          cbg: n.warn ? "#fef3c7" : on ? "#e0e7ff" : "#f5f4f1",
          cfg: n.warn ? "#92400e" : on ? "#4338ca" : "#a8a29e",
        };
      }),
      phases: verify ? verifyPhases : [
        { label: "Explore", mark: "✓", dotbg: "#4f46e5", dotline: "#4f46e5", dotfg: "#fff", fg: "#1c1917", note: "2m 10s", notefg: "#a8a29e", line: true },
        { label: "Define", mark: "!", dotbg: "#fef3c7", dotline: "#f59e0b", dotfg: "#92400e", fg: "#92400e", note: "waiting on you — 6", notefg: "#b45309", line: true },
        { label: "Design", mark: "", dotbg: "#fff", dotline: "#e8e6e1", dotfg: "#a8a29e", fg: "#a8a29e", note: false, line: true },
        { label: "Plan", mark: "", dotbg: "#fff", dotline: "#e8e6e1", dotfg: "#a8a29e", fg: "#a8a29e", note: false, line: true },
        { label: "Build", mark: "", dotbg: "#fff", dotline: "#e8e6e1", dotfg: "#a8a29e", fg: "#a8a29e", note: false, line: true },
        { label: "Verify", mark: "", dotbg: "#fff", dotline: "#e8e6e1", dotfg: "#a8a29e", fg: "#a8a29e", note: false, line: false },
      ],
      settingsFg: active === "settings" ? "#4f46e5" : "#78716c",
      settingsWt: active === "settings" ? 600 : 400,
    };
  }
}
</script>
</body>
</html>
