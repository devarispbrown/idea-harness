<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<aside style="width:232px;flex:none;background:#fff;border-right:1px solid #e8e6e1;display:flex;flex-direction:column;padding:16px 12px;box-sizing:border-box">
  <div style="display:flex;align-items:center;gap:8px;padding:4px 8px 14px"><span style="width:22px;height:22px;border-radius:6px;background:#4f46e5;color:#fff;display:grid;place-items:center;font:700 11px ui-monospace,Menlo,monospace">ih</span><span style="font-weight:600;font-size:13px;letter-spacing:-.01em;color:#1c1917">idea-harness</span></div>
  <div style="border:1px solid #e8e6e1;border-radius:8px;padding:8px 10px;margin-bottom:14px;background:#faf9f7;cursor:pointer">
    <div style="font-size:12.5px;font-weight:600;color:#1c1917">Usage-based billing</div>
    <div style="font-size:11px;color:#78716c;margin-top:1px">my-product · #3 of 3 ▾</div>
  </div>
  <sc-if value="{{ showInbox }}" hint-placeholder-val="{{ false }}">
    <div style="display:flex;align-items:center;gap:9px;padding:8px 10px;border-radius:8px;background:{{ inboxBg }};border:1px solid {{ inboxLine }};margin-bottom:16px;cursor:pointer">
      <span style="font-size:12.5px;font-weight:600;color:{{ inboxFg }}">{{ inboxLabel }}</span>
      <span style="margin-left:auto;font:700 10.5px ui-monospace,Menlo,monospace;background:{{ inboxPillBg }};color:{{ inboxPillFg }};border-radius:999px;padding:1px 7px">{{ inboxCount }}</span>
    </div>
  </sc-if>
  <div style="font-size:10px;text-transform:uppercase;letter-spacing:.07em;color:#a8a29e;font-weight:650;padding:0 10px 9px">Phases</div>
  <sc-for list="{{ phases }}" as="ph" hint-placeholder-count="6">
    <div style="display:flex;gap:10px;cursor:pointer">
      <div style="display:flex;flex-direction:column;align-items:center;flex:none;width:18px">
        <span style="width:16px;height:16px;border-radius:50%;background:{{ ph.dotbg }};border:2px solid {{ ph.dotline }};color:{{ ph.dotfg }};display:grid;place-items:center;font-size:8px;font-weight:800;box-sizing:border-box;margin-top:4px">{{ ph.mark }}</span>
        <sc-if value="{{ ph.line }}" hint-placeholder-val="{{ true }}"><span style="flex:1;width:2px;background:#e8e6e1;margin:3px 0;min-height:12px"></span></sc-if>
      </div>
      <div style="flex:1;min-width:0;padding:2px 10px 12px 0">
        <div style="display:flex;align-items:baseline;gap:6px"><span style="font-size:13px;font-weight:{{ ph.wt }};color:{{ ph.fg }}">{{ ph.label }}</span><sc-if value="{{ ph.pill }}" hint-placeholder-val="{{ false }}"><span style="font:700 9.5px ui-monospace,Menlo,monospace;background:{{ ph.pillbg }};color:{{ ph.pillfg }};border-radius:999px;padding:1px 6px">{{ ph.pill }}</span></sc-if></div>
        <sc-if value="{{ ph.note }}" hint-placeholder-val="{{ false }}"><div style="font-size:11px;color:{{ ph.notefg }};margin-top:1px">{{ ph.note }}</div></sc-if>
      </div>
    </div>
  </sc-for>
  <div style="margin-top:auto;display:flex;flex-direction:column;gap:7px;padding-top:16px">
    <div style="display:flex;align-items:center;gap:7px;padding:0 6px;font-size:11.5px;color:#78716c;cursor:pointer"><span style="width:7px;height:7px;border-radius:50%;background:#16a34a"></span><span style="font-family:ui-monospace,Menlo,monospace">claude-4.5</span><span style="margin-left:auto">Activity ↗</span></div>
    <div style="display:flex;gap:6px;font-size:12px;color:{{ settingsFg }};padding:0 6px;font-weight:{{ settingsWt }};cursor:pointer"><span>Settings</span><span style="margin-left:auto;border:1px solid #e8e6e1;border-radius:5px;padding:0 6px;font-size:10.5px;font-family:ui-monospace,Menlo,monospace;color:#78716c;font-weight:400">⌘K</span></div>
  </div>
</aside>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:&quot;232px&quot;,&quot;height&quot;:&quot;760px&quot;},&quot;active&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;define&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;options&quot;:[&quot;explore&quot;,&quot;define&quot;,&quot;design&quot;,&quot;plan&quot;,&quot;build&quot;,&quot;verify&quot;,&quot;settings&quot;]},&quot;stage&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;define&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;options&quot;:[&quot;explore&quot;,&quot;define&quot;,&quot;design&quot;,&quot;plan&quot;,&quot;build&quot;,&quot;verify&quot;]},&quot;inboxCount&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;0&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Out-of-phase inbox&quot;},&quot;inboxLabel&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Needs you elsewhere&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Out-of-phase inbox&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const active = this.props.active ?? "define";
    const stage = this.props.stage ?? "define";
    const order = ["explore", "define", "design", "plan", "build", "verify"];
    const si = order.indexOf(stage);
    const meta = {
      explore: { label: "Explore", doneNote: "brief + research" },
      define: { label: "Define", doneNote: "PRD v4 approved" },
      design: { label: "Design", doneNote: "architecture + spec" },
      plan: { label: "Plan", doneNote: "5 tasks approved" },
      build: { label: "Build", doneNote: "5 change sets applied" },
      verify: { label: "Verify", doneNote: "4 requirements verified" },
    };
    const live = {
      explore: { pill: "▶", pillbg: "#e0e7ff", pillfg: "#3730a3", note: "researching · 40s" },
      define: { pill: "3", pillbg: "#fef3c7", pillfg: "#92400e", note: "waiting on you" },
      design: { pill: "✓", pillbg: "#dcfce7", pillfg: "#166534", note: "approved · 3 documents" },
      plan: { pill: "1", pillbg: "#fef3c7", pillfg: "#92400e", note: "needs approval" },
      build: { pill: "1/5", pillbg: "#e0e7ff", pillfg: "#3730a3", note: "T-02 running" },
      verify: { pill: "1 ✕", pillbg: "#fee2e2", pillfg: "#991b1b", note: "R-002 failing" },
    };
    // Inbox holds ONLY items outside the phase you're reading; hidden when empty.
    const inboxCount = this.props.inboxCount ?? "0";
    const hot = inboxCount !== "0";
    return {
      showInbox: hot,
      inboxLabel: this.props.inboxLabel ?? "Needs you elsewhere",
      inboxCount,
      inboxBg: hot ? "#fffbeb" : "#faf9f7",
      inboxLine: hot ? "#fde68a" : "#e8e6e1",
      inboxFg: hot ? "#92400e" : "#57534e",
      inboxPillBg: hot ? "#f59e0b" : "#e8e6e1",
      inboxPillFg: hot ? "#fff" : "#a8a29e",
      phases: order.map((k, i) => {
        const m = meta[k];
        const on = k === active;
        const done = i < si;
        const cur = i === si;
        const l = cur ? live[k] : null;
        return {
          label: m.label,
          wt: on ? 650 : cur ? 600 : 400,
          fg: on ? "#4f46e5" : done ? "#57534e" : cur ? "#1c1917" : "#a8a29e",
          mark: done ? "✓" : cur ? "▶" : "",
          dotbg: done ? "#4f46e5" : cur ? "#eef2ff" : "#fff",
          dotline: done || cur ? "#4f46e5" : "#e8e6e1",
          dotfg: done ? "#fff" : "#4f46e5",
          pill: l ? l.pill : false,
          pillbg: l ? l.pillbg : "",
          pillfg: l ? l.pillfg : "",
          note: done ? m.doneNote : l ? l.note : false,
          notefg: l ? "#b45309" : "#a8a29e",
          line: i < order.length - 1,
        };
      }),
      settingsFg: active === "settings" ? "#4f46e5" : "#78716c",
      settingsWt: active === "settings" ? 600 : 400,
    };
  }
}
</script>
</body>
</html>
